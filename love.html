<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>지연시</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#fff4ee;--fg:#2b2130;--card:#ffffff;--ac:#e8557a;--mut:#7a6a80;--bd:#f0d9d9}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d1623;--fg:#f6eaf0;--card:#2a2032;--ac:#ff7a9c;--mut:#b9a6c0;--bd:#43344d}}
:root[data-theme="dark"]{--bg:#1d1623;--fg:#f6eaf0;--card:#2a2032;--ac:#ff7a9c;--mut:#b9a6c0;--bd:#43344d}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html{-webkit-text-size-adjust:100%}html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",sans-serif;overflow:hidden;display:flex;justify-content:center}
#app{overflow-y:auto;-webkit-overflow-scrolling:touch}
#app{width:100%;max-width:480px;padding:10px;height:calc(100vh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));height:calc(100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px}
h1{font-size:30px;margin:0;letter-spacing:-1px}
.sub{color:var(--mut);margin:0;font-size:15px}
.stage{position:relative;flex:none;width:100%;aspect-ratio:16/10;max-height:32dvh;border-radius:22px;overflow:hidden;border:2px solid var(--bd);background:#000}
.stage img{width:100%;height:100%;object-fit:cover;object-position:45% 30%;transition:filter .4s,transform .4s}
.emo{position:absolute;top:8px;right:12px;font-size:38px;filter:drop-shadow(0 2px 4px #0006)}
.m-angry{animation:shake .45s 2}.m-angry .emo{animation:pop .5s}
.m-fail .emo{font-size:38px}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@keyframes pop{from{transform:scale(.2)}to{transform:scale(1)}}
.hud{display:flex;justify-content:space-between;align-items:center;margin:0 2px;font-size:16px}
.hud span:last-child{font-size:12px;letter-spacing:-2px}
.say{background:var(--card);border:2px solid var(--bd);border-radius:16px;padding:12px 14px;margin:0;line-height:1.5;font-size:17px}
.say b{color:var(--ac)}
button{font:inherit;color:var(--fg);background:var(--card);border:2px solid var(--bd);border-radius:14px;padding:12px 14px;margin:0;font-size:16px;line-height:1.35;width:100%;text-align:left;cursor:pointer}
button:hover,button:focus-visible{border-color:var(--ac);outline:none}
button.go{background:var(--ac);color:#fff;border-color:var(--ac);text-align:center;font-weight:700}
.pg{display:grid;grid-template-columns:1fr 1fr;gap:8px}.pg button{text-align:center}
.pg small{display:block;color:var(--mut);font-size:13px}
.foot{color:var(--mut);font-size:13px;margin:0;text-align:center}
</style></head><body><div id="app"></div>
