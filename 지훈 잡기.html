<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#5a3a1e">
<title>두더지잡기</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
  html, body { margin: 0; height: 100%; background: #8fd16a; font-family: sans-serif; overflow: hidden; touch-action: manipulation; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: env(safe-area-inset-top) 8px env(safe-area-inset-bottom); }
  #stage { display: flex; flex-direction: column; align-items: center; width: 100%; }
  h1 { margin: 0; color: #2d5a12; font-size: 24px; }
  .score { font-size: 44px; font-weight: 900; color: #fff; text-shadow: 0 3px 0 #2d5a12; margin: 0 0 6px; }
  .score.pulse { animation: pulse .18s ease-out; }
  @keyframes pulse { 0% { transform: scale(1.5); color: #ffe066; } 100% { transform: scale(1); } }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; width: min(98vw, 56vh, 520px); }
  .hole { position: relative; aspect-ratio: 1 / 1.15; overflow: hidden; }
  .hole::after { content: ""; position: absolute; left: -4%; right: -4%; bottom: 0; height: 26%; background: radial-gradient(ellipse at center top, #3b2410 0 55%, #5a3a1e 56%); border-radius: 50% 50% 0 0 / 40% 40% 0 0; z-index: 2; }
  .mole { position: absolute; left: 0; width: 100%; height: 94%; bottom: 8%; transform: translateY(115%); transition: transform .09s cubic-bezier(.2,1.6,.4,1); z-index: 1; transform-origin: 50% 100%; }
  .mole img { width: 100%; height: 100%; object-fit: contain; object-position: center bottom; display: block; pointer-events: none; filter: drop-shadow(0 4px 4px rgba(0,0,0,.35)); }
  .mole.up { transform: translateY(0); }
  .mole.hit { transition: transform .12s ease-out; transform: translateY(18%) scale(1.2, .65) rotate(-5deg); }
  .mole.hit img { filter: brightness(2.2) saturate(.2); }
  #start, .startbtn { margin-top: 14px; padding: 14px 44px; font-size: 22px; border: 0; border-radius: 30px; background: #ff9f1c; color: #fff; font-weight: bold; box-shadow: 0 5px 0 #c97800; }
  #start:active, .startbtn:active { transform: translateY(3px); box-shadow: 0 2px 0 #c97800; }
  .fx { position: fixed; pointer-events: none; z-index: 50; font-weight: 900; }
  .plus { font-size: 40px; color: #fff; text-shadow: 0 3px 0 #d62828, 0 0 8px #ffe066; animation: floatup .6s ease-out forwards; }
  @keyframes floatup { 0% { transform: translate(-50%, 0) scale(.5); opacity: 1; } 30% { transform: translate(-50%, -20px) scale(1.4); } 100% { transform: translate(-50%, -90px) scale(1); opacity: 0; } }
  .boom { font-size: 64px; animation: boom .3s ease-out forwards; }
  @keyframes boom { 0% { transform: translate(-50%, -50%) scale(.3) rotate(-20deg); opacity: 1; } 100% { transform: translate(-50%, -50%) scale(1.6) rotate(15deg); opacity: 0; } }
  .star { font-size: 26px; transition: transform .45s ease-out, opacity .45s ease-out; }
  .lives { font-size: 30px; letter-spacing: 4px; margin-bottom: 8px; min-height: 38px; }
  .lives.lose { animation: shake .3s linear; }
  #over { position: fixed; inset: 0; background: rgba(0,0,0,.7); z-index: 60; display: none; flex-direction: column; align-items: center; justify-content: center; color: #fff; }
  #over.show { display: flex; }
  #over h2 { font-size: 44px; margin: 0 0 8px; color: #ff6b6b; }
  #over p { font-size: 28px; margin: 0 0 24px; }
  .flash { position: fixed; inset: 0; background: #fff; opacity: 0; pointer-events: none; z-index: 40; }
  .flash.on { animation: fl .12s ease-out; }
  @keyframes fl { 0% { opacity: .45; } 100% { opacity: 0; } }
  #stage.shake { animation: shake .16s linear; }
  @keyframes shake { 0%,100% { transform: translate(0,0); } 20% { transform: translate(-7px, 4px); } 40% { transform: translate(6px, -5px); } 60% { transform: translate(-5px, -3px); } 80% { transform: translate(4px, 4px); } }
</style>
</head>
<body>
  <div class="flash" id="flash"></div>
  <div id="over"><h2>게임 오버</h2><p>점수: <span id="finalScore">0</span></p><button id="again" class="startbtn">재시작</button></div>
  <div id="stage">
    <h1>두더지잡기</h1>
    <div class="score">점수: <span id="score">0</span></div>
    <div class="lives" id="lives"></div>
    <div class="grid" id="grid"></div>
    <button id="start">시작</button>
  </div>

// ---- 효과음 (WebAudio) ----
let ac = null;
function audio() {
  if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
  if (ac && ac.state === 'suspended') ac.resume();
  return ac;
}
function hitSound() {
  const a = audio(); if (!a) return;
  const t = a.currentTime;
  // 쿵 (낮은 주파수가 떨어지는 소리)
  const o = a.createOscillator(), g = a.createGain();
  o.type = 'sine';
  o.frequency.setValueAtTime(220, t);
  o.frequency.exponentialRampToValueAtTime(45, t + .16);
  g.gain.setValueAtTime(.9, t);
  g.gain.exponentialRampToValueAtTime(.001, t + .2);
  o.connect(g).connect(a.destination);
  o.start(t); o.stop(t + .21);
  // 퍽 (노이즈)
  const len = a.sampleRate * .08;
  const buf = a.createBuffer(1, len, a.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
  const n = a.createBufferSource(); n.buffer = buf;
  const ng = a.createGain(); ng.gain.value = .5;
  n.connect(ng).connect(a.destination); n.start(t);
  // 띠링 (점수음)
  const o2 = a.createOscillator(), g2 = a.createGain();
  o2.type = 'triangle';
  o2.frequency.setValueAtTime(660 + Math.random() * 200, t + .03);
  g2.gain.setValueAtTime(.25, t + .03);
  g2.gain.exponentialRampToValueAtTime(.001, t + .22);
  o2.connect(g2).connect(a.destination);
  o2.start(t + .03); o2.stop(t + .23);
}

// ---- 타격 효과 ----
function fx(cls, text, x, y) {
  const e = document.createElement('div');
  e.className = 'fx ' + cls;
  e.textContent = text;
  e.style.left = x + 'px'; e.style.top = y + 'px';
  document.body.appendChild(e);
  setTimeout(() => e.remove(), 700);
  return e;
}
function burst(x, y) {
  const icons = ['⭐', '✨', '💥', '⭐', '✨'];
  for (let i = 0; i < 8; i++) {
    const e = fx('star', icons[i % icons.length], x, y);
    e.style.transform = 'translate(-50%, -50%)';
    const ang = (Math.PI * 2 * i) / 8 + Math.random() * .4;
    const dist = 60 + Math.random() * 50;
    requestAnimationFrame(() => requestAnimationFrame(() => {
      e.style.transform = `translate(calc(-50% + ${Math.cos(ang) * dist}px), calc(-50% + ${Math.sin(ang) * dist}px)) rotate(${Math.random() * 360}deg)`;
      e.style.opacity = 0;
    }));
  }
}
function hitEffects(x, y) {
  fx('boom', '💥', x, y);
  fx('plus', '+1', x, y - 20);
  burst(x, y);
  stage.classList.remove('shake'); void stage.offsetWidth; stage.classList.add('shake');
  flashEl.classList.remove('on'); void flashEl.offsetWidth; flashEl.classList.add('on');
  scoreBox.classList.remove('pulse'); void scoreBox.offsetWidth; scoreBox.classList.add('pulse');
  if (navigator.vibrate) navigator.vibrate(35);
  hitSound();
}

for (let i = 0; i < 9; i++) {
  const hole = document.createElement('div');
  hole.className = 'hole';
  const mole = document.createElement('div');
  mole.className = 'mole';
  const img = document.createElement('img');
  mole.appendChild(img);
  hole.appendChild(mole);
  grid.appendChild(hole);
  const m = { el: mole, img, up: false, busy: false, hideTimer: null };
  moles.push(m);
  hole.addEventListener('pointerdown', (ev) => {
    if (!m.up) return;
    score++;
    scoreEl.textContent = score;
    m.up = false; m.busy = true;
    clearTimeout(m.hideTimer);
    m.el.classList.add('hit');
    setTimeout(() => { m.el.classList.remove('up', 'hit'); m.busy = false; }, 170);
    hitEffects(ev.clientX, ev.clientY);
  });
}

function hide(m) {
  m.up = false;
  m.el.classList.remove('up', 'hit');
  clearTimeout(m.hideTimer);
}

function renderLives() {
  livesEl.textContent = '❤️'.repeat(lives) + '🖤'.repeat(MAX_LIVES - lives);
}

function missSound() {
  const a = audio(); if (!a) return;
  const t = a.currentTime;
  const o = a.createOscillator(), g = a.createGain();
  o.type = 'sawtooth';
  o.frequency.setValueAtTime(220, t);
  o.frequency.exponentialRampToValueAtTime(70, t + .3);
  g.gain.setValueAtTime(.3, t);
  g.gain.exponentialRampToValueAtTime(.001, t + .32);
  o.connect(g).connect(a.destination);
  o.start(t); o.stop(t + .33);
}

function miss(m) {
  hide(m);
  if (!running) return;
  lives--;
  renderLives();
  livesEl.classList.remove('lose'); void livesEl.offsetWidth; livesEl.classList.add('lose');
  if (navigator.vibrate) navigator.vibrate(120);
  missSound();
  if (lives <= 0) gameOver();
}

// 점수가 오를수록 빨라짐
function spawnDelay() { return Math.max(260, 850 - score * 14); }
function showTime() { return Math.max(480, 1400 - score * 20) + Math.random() * 250; }

function pop() {
  const free = moles.filter(m => !m.up && !m.busy);
  if (!free.length) return;
  const m = free[Math.floor(Math.random() * free.length)];
  m.img.src = IMAGES[Math.floor(Math.random() * IMAGES.length)];
  m.up = true;
  m.el.classList.add('up');
  m.hideTimer = setTimeout(() => miss(m), showTime());
}

function loop() {
  if (!running) return;
  pop();
  spawnTimer = setTimeout(loop, spawnDelay());
}

function stopAll() {
  running = false;
  clearTimeout(spawnTimer);
  moles.forEach(m => { hide(m); m.busy = false; });
}

function gameOver() {
  stopAll();
  document.getElementById('finalScore').textContent = score;
  overEl.classList.add('show');
  startBtn.textContent = '재시작';
}

function startGame() {
  audio();
  stopAll();
  score = 0; lives = MAX_LIVES;
  scoreEl.textContent = 0;
  renderLives();
  overEl.classList.remove('show');
  startBtn.textContent = '재시작';
  running = true;
  spawnTimer = setTimeout(loop, 400);
}

startBtn.addEventListener('click', startGame);
document.getElementById('again').addEventListener('click', startGame);
renderLives();
</script>
