<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"><title>광질 게임</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f4f1ea;--card:#fff;--tx:#222;--mu:#777;--ac:#c07a2a;--bd:#ddd}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b1a18;--card:#2a2825;--tx:#eee;--mu:#aaa;--ac:#e0a050;--bd:#444}}
:root[data-theme="dark"]{--bg:#1b1a18;--card:#2a2825;--tx:#eee;--mu:#aaa;--ac:#e0a050;--bd:#444}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Malgun Gothic",sans-serif;max-width:560px;margin:auto;padding:12px}
.top{display:flex;justify-content:space-between;font-weight:700;margin-bottom:8px}
.tabs{display:flex;gap:6px;margin-bottom:10px}
.tabs button{flex:1;padding:10px 4px;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:8px;font-size:14px}
.tabs button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:10px}
#rock{font-size:110px;text-align:center;cursor:pointer;user-select:none;line-height:1.2;transition:transform .06s}
#rock:active{transform:scale(.92) rotate(-4deg)}
.bar{height:12px;background:var(--bd);border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ac);width:100%}
#res{min-height:150px;text-align:center}
#res img{width:110px;height:110px;object-fit:contain}
.junkE{font-size:64px}
.gold{filter:sepia(1) saturate(6) hue-rotate(5deg) brightness(1.15) drop-shadow(0 0 10px gold)}
.r0{color:#888}.r1{color:#4a9}.r2{color:#39f}.r3{color:#a5f}.r4{color:#f80}.r5{color:#d4a017}
.row{display:flex;align-items:center;gap:10px;padding:6px 0;border-bottom:1px solid var(--bd)}
.row img{width:44px;height:44px;object-fit:contain}.row .e{font-size:32px;width:44px;text-align:center}
.row div{flex:1;font-size:14px}.row small{color:var(--mu)}
.btn{padding:8px 12px;border:0;border-radius:8px;background:var(--ac);color:#fff;font-size:14px}
.btn:disabled{opacity:.4}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.gi{text-align:center;font-size:12px;border:1px solid var(--bd);border-radius:10px;padding:6px}
.gi img{width:64px;height:64px;object-fit:contain}
.gi.no{opacity:.3;filter:grayscale(1)}
p{margin:4px 0}
</style></head><body>

const luck=()=>1+PK[S.tier][3]+.12*S.enh;
function roll(){const L=luck();const R=REG[S.reg];const w=ORES.map(o=>o[4]*L*R.tw[o[2]]);const tot=R.junk+w.reduce((a,b)=>a+b,0);let r=Math.random()*tot;
 if(r<R.junk){const j=JUNK[Math.floor(Math.random()*JUNK.length)];return{junk:1,n:j[1],e:j[0],v:j[2],t:0,k:"j"+j[1]}}
 r-=R.junk;for(let i=0;i<ORES.length;i++){if(r<w[i]){const o=ORES[i];return{n:o[0],img:o[1],t:o[2],v:o[3],gold:o[5],k:"o"+i}}r-=w[i]}
 const o=ORES[0];return{n:o[0],img:o[1],t:o[2],v:o[3],k:"o0"}}
function mine(){if(Z)return;zmsg="";if(bagN()>=cap()){full=1;render();return}hp-=pow();const b=document.getElementById("hb");
 if(hp<=0){const it=roll();hp=REG[S.reg].hp;full=0;S.cnt++;S.bag[it.k]=(S.bag[it.k]||0)+1;S.seen[it.k]=1;last=it;save();render();if(!Z&&Math.random()<.07)spawnZ()}
 else if(b)b.style.width=(hp/REG[S.reg].hp*100)+"%"}
function ico(it,cls){return it.junk?`<div class="junkE">${it.e}</div>`:`<img src="${IMGS[it.img]}" class="${it.gold?"gold":""}">`}
function info(k){if(k[0]=="j"){const j=JUNK.find(x=>"j"+x[1]==k);return{junk:1,n:j[1],e:j[0],v:j[2],t:0,k}}const i=+k.slice(1),o=ORES[i];return{n:o[0],img:o[1],t:o[2],v:o[3],gold:o[5],k}}
const val=it=>it.v*(1+.1*S.enh);
function sell(k,all){const n=S.bag[k]||0;if(!n)return;const it=info(k);S.g+=val(it)*n;delete S.bag[k];save();render()}
function sellAll(){Object.keys(S.bag).forEach(k=>{S.g+=val(info(k))*S.bag[k]});S.bag={};save();render()}
function buy(i){const p=PK[i][1];if(S.g<p||i<=S.tier)return;S.g-=p;S.tier=i;S.enh=0;save();render()}
const ecost=()=>Math.floor(150*Math.pow(1.7,S.enh)*(S.tier+1));
const erate=()=>Math.max(.2,.95-.08*S.enh);
function enhance(){if(S.enh>=10)return;const c=ecost();if(S.g<c)return;S.g-=c;const ok=Math.random()<erate();if(ok)S.enh++;save();render(ok?"✨ 강화 성공!":"💥 강화 실패 (등급 유지)")}
function render(msg){
 if(Z)tab="mine";document.getElementById("gold").textContent=fmt(S.g);
 document.getElementById("pk").textContent=PK[S.tier][0]+(S.enh?" +"+S.enh:"");
 document.querySelectorAll(".tabs button").forEach(b=>b.classList.toggle("on",b.dataset.t==tab));
 let h="";
 if(tab=="mine"){
  h=`<div class="card"><div id="rock" onclick="mine()">${REG[S.reg].e}</div><div class="bar"><i id="hb" style="width:${hp/REG[S.reg].hp*100}%"></i></div><p style="text-align:center;color:var(--mu);font-size:13px">클릭해서 캐기 · 공격력 ${pow().toFixed(1)} · 행운 x${luck().toFixed(2)} · 총 ${S.cnt}회</p><p style="text-align:center;font-size:13px">📍 ${REG[S.reg].n} · 🎒 ${bagN()}/${cap()}${full?" <b style='color:#e44'>가방이 가득 찼어요! 상점에서 판매하세요</b>":""}</p></div>`;
  if(Z){h=`<div class="card" style="text-align:center"><div style="font-size:110px;cursor:pointer;user-select:none" onclick="hitZ()">🧟</div><p><b>좀비가 나타났다! 빨리 클릭해서 잡으세요!</b></p><div class="bar"><i id="zh" style="width:${Z.hp/Z.max*100}%;background:#d33"></i></div><div class="bar" style="margin-top:6px"><i id="zt" style="width:${Z.t/Z.tm*100}%"></i></div><p style="font-size:12px;color:var(--mu)">8초 안에 못 잡으면 보유 골드의 20%를 잃어요 (좀비는 체력을 계속 회복해요!)</p></div>`}else if(last){h+=`<div class="card" id="res">${ico(last)}<p class="${T[last.t].c}"><b>${last.n}</b></p><p>[${T[last.t].n}] 판매가 ${fmt(val(last))}원</p></div>`}
  else h+=`<div class="card" id="res"><p style="color:var(--mu)">바위를 캐보세요!</p></div>`;
 }
 if(tab=="shop"){
  h=`<div class="card"><b>🎒 가방 ${bagN()}/${cap()}</b> <button class="btn" ${S.g<capCost()?"disabled":""} onclick="buyCap()">+10칸 확장 ${fmt(capCost())}원</button></div><div class="card"><button class="btn" onclick="sellAll()">전부 판매</button> <small style="color:var(--mu)">강화할수록 판매가 +10%씩</small></div><div class="card">`;
  const ks=Object.keys(S.bag);
  h+=ks.length?ks.map(k=>{const it=info(k);return `<div class="row">${it.junk?`<div class="e">${it.e}</div>`:`<img src="${IMGS[it.img]}" class="${it.gold?"gold":""}">`}<div><b class="${T[it.t].c}">${it.n}</b> x${S.bag[k]}<br><small>${fmt(val(it))}원 / 개</small></div><button class="btn" onclick="sell('${k}')">판매</button></div>`}).join(""):`<p style="color:var(--mu)">팔 물건이 없어요.</p>`;
  h+="</div>";
 }
 if(tab=="pick"){
  h=`<div class="card"><b>곡괭이 상점</b>`+PK.map((p,i)=>`<div class="row"><div class="e">⛏</div><div><b>${p[0]}</b><br><small>공격력 ${p[2]} · 행운 +${Math.round(p[3]*100)}%</small></div>${i<=S.tier?`<small>${i==S.tier?"사용중":"보유"}</small>`:`<button class="btn" ${S.g<p[1]?"disabled":""} onclick="buy(${i})">${fmt(p[1])}원</button>`}</div>`).join("")+"</div>";
  h+=`<div class="card"><b>곡괭이 강화</b> ${msg?`<p>${msg}</p>`:""}<p>현재 ${PK[S.tier][0]} +${S.enh} / +10</p><p><small style="color:var(--mu)">강화당 공격력 +15%, 행운 +12%, 판매가 +10% · 성공확률 ${S.enh>=10?"-":Math.round(erate()*100)+"%"} · 곡괭이를 새로 사면 강화가 초기화돼요</small></p><button class="btn" ${S.enh>=10||S.g<ecost()?"disabled":""} onclick="enhance()">${S.enh>=10?"최대 강화":"강화하기 "+fmt(ecost())+"원"}</button></div>`;
 }
 if(tab=="reg"){h=`<div class="card"><b>광산 지역</b>`+REG.map((r,i)=>`<div class="row"><div class="e">${r.e}</div><div><b>${r.n}</b>${i==S.reg?" (현재)":""}<br><small>바위 체력 ${r.hp} · ${r.d}</small></div>${i<=S.unl?(i==S.reg?"":`<button class="btn" onclick="setReg(${i})">이동</button>`):`<button class="btn" ${i>S.unl+1||S.g<r.cost?"disabled":""} onclick="buyReg(${i})">${fmt(r.cost)}원</button>`}</div>`).join("")+"</div>"}
 if(tab=="bag"){
  h=`<div class="card"><b>도감</b><div class="grid" style="margin-top:8px">`+ORES.map((o,i)=>{const k="o"+i,s=S.seen[k];return `<div class="gi ${s?"":"no"}"><img src="${IMGS[o[1]]}" class="${o[5]?"gold":""}"><br><b class="${T[o[2]].c}">${s?o[0]:"???"}</b><br>${T[o[2]].n}${s?` · ${fmt(o[3])}원<br>x${S.bag[k]||0}`:""}</div>`}).join("")+`</div></div><div class="card"><button class="btn" onclick="if(confirm('정말 초기화할까요?')){S={g:0,tier:0,enh:0,bag:{},seen:{},cnt:0,capLv:0,reg:0,unl:0};hp=6;save();render()}">데이터 초기화</button></div>`;
 }
 if(zmsg&&!Z)h=`<div class="card" style="text-align:center">${zmsg}</div>`+h;document.getElementById("v").innerHTML=h}
document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>{tab=b.dataset.t;render()});
render();
</script></body></html>
