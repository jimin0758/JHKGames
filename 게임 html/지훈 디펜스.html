<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><title>지훈 디펜스</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--bg:#f3efe6;--fg:#1c1b22;--card:#fff;--bd:#d6cfbf;--ac:#e8453c;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#15161d;--fg:#f1eee6;--card:#242633;--bd:#3a3d52}}
*{box-sizing:border-box}html,body{height:100%;overflow:hidden}body{margin:0;background:var(--bg);color:var(--fg);font:clamp(12px,1.5vmin + 6px,17px)/1.25 "Jua","Apple SD Gothic Neo","Noto Sans KR",sans-serif;padding:6px;-webkit-user-select:none;user-select:none;touch-action:manipulation}
#app{height:100%;display:flex;flex-direction:column;gap:6px;max-width:1500px;margin:auto}
#main{flex:1;min-height:0;display:flex;flex-direction:column;gap:4px}
#cw{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;overflow:hidden}
#side{display:flex;flex-direction:column;gap:6px;height:clamp(210px,40%,360px);min-height:0}
#bt{flex:1;min-height:0;display:flex;flex-direction:column;gap:5px}
.grp{flex:var(--r,1);min-height:0;display:flex;flex-direction:column;gap:2px;border:2px solid var(--bd);border-radius:12px;padding:3px 4px 4px}
.gl{font-weight:700;font-size:.8em;opacity:.7;padding-left:4px;line-height:1.1}
.gb{flex:1;min-height:0;display:grid;grid-template-columns:repeat(var(--c),1fr);gap:4px}
#G1{--c:3}#G2{--c:5}#G3{--c:3}
#gc{display:flex;gap:4px}#gc button{flex-direction:row;padding:3px 8px}#gc small{display:none}
@media (min-aspect-ratio:1/1){#app{flex-direction:row}#side{height:auto;width:clamp(250px,40%,440px)}#G2{--c:3;--r:2}#G3{--c:3;--r:1}}
#top{display:flex;justify-content:space-between;align-items:center;gap:6px;font-weight:700;white-space:nowrap;flex-wrap:wrap}#top b{font-size:1.15em}
canvas{touch-action:none;display:block;border-radius:10px;border:2px solid var(--bd)}

button{background:var(--card);color:var(--fg);border:2px solid var(--bd);border-radius:10px;padding:2px;font:inherit;text-align:center;display:flex;flex-direction:column;gap:1px;align-items:center;justify-content:center;cursor:pointer;min-width:0;overflow:hidden}
button:disabled{opacity:.45}button:active:not(:disabled){transform:scale(.97)}
button img{height:clamp(18px,4vmin,34px)}button small{display:block;opacity:.75;font-size:.82em}button b{display:block}
#info{min-height:2.8em;padding:4px 8px;border:2px dashed var(--bd);border-radius:10px;display:flex;justify-content:space-between;align-items:center;gap:6px;font-size:.92em}#sell{flex:none;padding:6px 10px}
#toast{position:absolute;left:50%;bottom:10px;max-width:84%;text-align:center;transform:translateX(-50%);background:#000c;color:#fff;padding:8px 14px;border-radius:20px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:5}
#ov{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;flex-direction:column;gap:12px;color:#fff;font-size:20px;text-align:center;z-index:9}
#ov button{justify-content:center;font-size:18px}
#pk{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;flex-direction:column;gap:12px;color:#fff;z-index:8;text-align:center}#pkb{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;width:min(92vw,360px)}#pkb button{padding:8px}#pk>button{justify-content:center;padding:8px 20px}
#ab{position:fixed;left:50%;top:30%;transform:translateX(-50%);background:#000d;color:#fff;padding:10px 14px;border-radius:12px;display:none;z-index:7;text-align:center;pointer-events:none;max-width:88vw;line-height:1.5}button{-webkit-touch-callout:none}
@media (max-width:560px) and (max-aspect-ratio:1/1){#top b{display:none}}
#md{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;z-index:10;padding:8px}
#mb{background:var(--bg);color:var(--fg);width:min(96vw,540px);max-height:90vh;overflow:auto;border-radius:14px;padding:10px;border:2px solid var(--bd)}
#mh{display:flex;justify-content:space-between;align-items:center;gap:6px;position:sticky;top:-10px;background:var(--bg);padding:6px 0;z-index:1}#mh button{padding:4px 12px;flex-direction:row}
.tabs{display:flex;gap:6px;margin:4px 0}.tabs button{flex:1;padding:6px;flex-direction:row}.tabs .on{border-color:var(--ac);font-weight:700}
.cd{display:flex;gap:8px;align-items:flex-start;border:2px solid var(--bd);background:var(--card);border-radius:10px;padding:6px;margin:6px 0;font-size:.92em;line-height:1.4}.cd>img{flex:none}.cd>button{flex:none;padding:6px 10px;align-self:center}.cd>div{flex:1;min-width:0}
#m{line-height:1.2;text-align:left;min-width:9em;font-variant-numeric:tabular-nums;white-space:nowrap}#r{display:inline-block;min-width:5.5em;font-variant-numeric:tabular-nums}#cw{position:relative}#bm{position:absolute;left:4px;bottom:4px;width:40px;height:40px;padding:0;opacity:.85;z-index:2;font-size:1.2em}#bm small{display:none}
#mm{position:fixed;inset:0;display:none;align-items:center;justify-content:center;z-index:12;padding:8px}
#mmc{background:var(--card);color:var(--fg);border:2px solid var(--bd);border-radius:16px;padding:16px;width:min(92vw,380px);max-height:92vh;overflow:auto;display:flex;flex-direction:column;gap:10px;text-align:center}
.mb{padding:12px;font-size:1.05em;flex-direction:row;width:100%}.mb.sl{flex-direction:column;align-items:flex-start;text-align:left;gap:2px}.mrow{display:flex;justify-content:center;gap:6px}
.sm{font-size:.85em;opacity:.85}.ok{opacity:1;color:var(--ac)}
</style></head><body>
<div id="app"><div id="main">
<div id="top"><b>지훈 디펜스</b><span id="r"></span><span id="m"></span><span id="gc"></span></div>
<div id="cw"><canvas id="c" width="720" height="840"></canvas></div></div>
<div id="side">
<div id="info"><span id="it">자리를 눌러 아군 확인 · 잠긴 칸은 구매</span><button id="sell" style="display:none"></button></div>
<div id="bt"><div class="grp" id="G1"><div class="gl">소환</div><div class="gb" id="gs"></div></div><div class="grp" id="G2"><div class="gl">강화 · 꾹 누르면 능력 보기</div><div class="gb" id="gu"></div></div><div class="grp" id="G3"><div class="gl">스킬</div><div class="gb" id="gk"></div></div></div></div></div>
<div id="md"><div id="mb"><div id="mh"><b id="mt"></b><button id="mx">✖ 닫기</button></div><div id="mc"></div></div></div><div id="mm"><div id="mmc"></div></div><div id="toast"></div><div id="ab"></div><div id="pk"><div>확률업할 캐릭터를 고르세요<br><small>다음 3번 소환에서 확률 2배</small></div><div id="pkb"></div><button id="pkx">취소</button></div><div id="ov"><div id="ovt"></div><button id="rs">다시 시작</button><button id="rm">메인 화면</button></div>

function ice(){if(!S.enemies.length)return toast('적이 없어요');if(pay(costIce())){S.cnt.i++;S.freeze=3;sfx('ice');toast('❄ 3초 빙결')}}
function luck(){if(!pay(costLuck()))return;const x=rnd();
if(x<.35)toast('🎰 꽝...');else if(x<.65){S.money+=100;toast('🎰 +100원')}
else if(x<.85){if(place(Math.floor(rnd()*4)))toast('🎰 공짜 소환!');else{S.money+=60;toast('🎰 자리 없음 → +60원')}}
else if(x<.96){const t=Math.floor(rnd()*4);S.lv[t]++;toast('🎰 '+CH[t].n+' 강화!')}
else{const j=500+S.round*30;S.money+=j;toast('🎰 잭팟! +'+j+'원')}}
mkb('gs','bs',summon);mkb('gs','bb',openPk);mkb('gs','bl',()=>buySlot());
CH.forEach((c,i)=>mkb('pkb','p'+i,()=>pickBoost(i),IMS[i]));$('pkx').onclick=()=>$('pk').style.display='none';
mkb('gc','bn',()=>{if(!S.inRound)S.wait=0});const SPD=[.5,1,2,3,5];mkb('gc','bv',()=>{S.speed=SPD[(SPD.indexOf(S.speed)+1)%SPD.length]});mkb('gc','bx',restart);mkb('cw','bm',()=>{mute=!mute;sv('jhd_mute',mute?'1':'0');if(!mute)sfx('buy')});mkb('gc','bd',()=>openMd('a'));mkb('gc','ba',()=>openMd('w'));mkb('gc','bp',pauseGame);
function showAb(i){const c=CH[i],l=S.lv[i],f=k=>1+.3*(k-1),a=S.aw[i];let ex='';
if(i==0)ex='감속 장판(반경 44, 2.5초): 안의 적 '+pc(slowV(l))+' 감속 → 다음 레벨 '+pc(slowV(l+1))+(S.aw[0]>=2?' · 겹치면 곱연산으로 중첩':' · 장판이 겹쳐도 중첩 안 됨');
if(i==1)ex='치명타 확률 30% (피해 2배)';
if(i==2)ex='주변 아군 공격력·속도 +'+pc(buffV(l))+' → 다음 레벨 '+pc(buffV(l+1))+' (최대 2.5배)';
if(i==3)ex='반경 42 안 주변 적에게 70% 폭발 피해';
const e=$('ab');e.innerHTML=`<b>${c.n} Lv${l}${a?' '+'★'.repeat(a):''}</b><br>${c.d}<br>공격력 ${Math.round(c.dmg*f(l))} → 다음 레벨 ${Math.round(c.dmg*f(l+1))}<br>사거리 ${c.rng} · 공격 간격 ${c.cd}초<br>${ex}<br><small>모든 공격은 10% 확률로 치명타(피해 2배)</small>`;e.style.display='block'}
CH.forEach((c,i)=>mkb('gu','u'+i,()=>{if(pay(costUp(i))){S.lv[i]++;sfx('up')}},IMS[i]));
CH.forEach((c,i)=>{const b=$('u'+i);let tm=0,lp=0;b.addEventListener('pointerdown',()=>{lp=0;clearTimeout(tm);tm=setTimeout(()=>{lp=1;showAb(i)},450)});['pointerup','pointerleave','pointercancel'].forEach(ev=>b.addEventListener(ev,()=>{clearTimeout(tm);$('ab').style.display='none'}));b.oncontextmenu=e=>e.preventDefault();b.onclick=()=>{if(lp){lp=0;return}if(pay(costUp(i))){S.lv[i]++;sfx('up')}}});
mkb('gu','bc',()=>{if(pay(costCastle())){const q=S.hp/S.hpMax;S.hpUp++;S.hpMax+=50;S.hp=Math.round(S.hpMax*q);sfx('up')}});
mkb('gk','k0',bomb);mkb('gk','k1',ice);mkb('gk','kh',heal);
$('sell').onclick=sell;function newGame(){try{localStorage.removeItem('jhd_save')}catch(e){}fresh();FX=[];$('ov').style.display='none'}let rsT=0;function restart(){if(Date.now()-rsT<2500){rsT=0;newGame();toast('새 게임 시작!')}else{rsT=Date.now();toast('한 번 더 누르면 처음부터 다시 시작해요')}}$('rs').onclick=newGame;
let MO=0,MD='a',MM=0,pend=0;
function slotInfo(n){try{const o=JSON.parse(ld('jhd_slot'+n));if(o&&o.round>=0)return o}catch(e){}return null}
function slotBtn(n,fn){const o=slotInfo(n);const t=o?`라운드 ${o.round} · 💰 ${Math.floor(o.money)} · ★ ${(o.aw||[0]).reduce((a,b)=>a+b,0)} · ${new Date(o.saved||0).toLocaleString('ko-KR',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'})}`:'비어 있음';return `<button class="mb sl" ${(!o&&fn=='mmLoad')?'disabled':''} onclick="${fn}(${n})"><b>💾 세이브 ${n}</b><small>${t}</small></button>`}
function rMm(v){pend=0;MM=1;const m=$('mm'),c=$('mmc');m.style.display='flex';m.style.background=(v=='main'||v=='load')?'var(--bg)':'#000b';let h='';
if(v=='main')h=`<div style="font-size:2em;font-weight:700;line-height:1.2">🏰<br>지훈 디펜스</div><div class="mrow">${[0,1,2,3].map(i=>`<img src="${IMS[i]}" style="height:48px">`).join('')}</div><div class="sm">최고 기록: 라운드 ${best}</div><button class="mb" onclick="mmNew()">▶ 새 게임</button><button class="mb" onclick="rMm('load')">📂 이어하기</button>`;
else if(v=='load')h=`<b>📂 세이브 불러오기</b>`+[1,2,3,4,5].map(n=>slotBtn(n,'mmLoad')).join('')+`<button class="mb" onclick="rMm('main')">← 뒤로</button>`;
else if(v=='pause')h=`<b style="font-size:1.3em">⏸ 일시정지</b><button class="mb" onclick="mmClose()">▶ 계속하기</button><button class="mb" onclick="rMm('save')">💾 저장하고 나가기</button><button class="mb" onclick="rMm('quit')">🚪 저장하지 않고 나가기</button>`;
else if(v=='quit')h=`<b style="font-size:1.2em">⚠ 저장하지 않고 나갈까요?</b><div>저장하지 않은 진행 상황은 사라져요.</div><button class="mb" onclick="rMm('main')">🚪 나가기</button><button class="mb" onclick="rMm('pause')">← 취소</button>`;
else h=`<b>💾 저장할 파일 선택</b>`+[1,2,3,4,5].map(n=>slotBtn(n,'mmSave')).join('')+`<div class="sm">이미 저장된 파일은 한 번 더 누르면 덮어써요</div><button class="mb" onclick="rMm('pause')">← 뒤로</button>`;
c.innerHTML=h}
function mmClose(){MM=0;$('mm').style.display='none'}
function mmNew(){newGame();mmClose();toast('새 게임 시작!')}
function mmLoad(n){const o=slotInfo(n);if(!o)return;loadObj(o);mmClose();toast('세이브 '+n+' 불러왔어요')}
function mmSave(n){if(slotInfo(n)&&pend!=n){pend=n;toast('덮어쓰려면 한 번 더 누르세요');return}let ok=false;try{const j=snap();localStorage.setItem('jhd_slot'+n,j);ok=localStorage.getItem('jhd_slot'+n)==j}catch(e){}if(ok){toast('세이브 '+n+'에 저장했어요');rMm('main')}else toast('저장에 실패했어요 (브라우저 저장소를 쓸 수 없어요)')}
function pauseGame(){if(S.over||MM)return;rMm('pause')}
$('rm').onclick=()=>{$('ov').style.display='none';rMm('main')};
const stars=n=>'★'.repeat(n)+'☆'.repeat(3-n);
const icon=(t,h)=>`<img src="${IMS[t]}" style="height:${h}px">`;
const awl=i=>AWK[i].map((w,k)=>`<div class="sm ${S.aw[i]>k?'ok':''}">${S.aw[i]>k?'✅':'🔒'} ${k+1}단계 [${w.n}] ${w.d}</div>`).join('');
function openMd(m){MO=1;MD=m;rMd();$('md').style.display='flex'}
function closeMd(){MO=0;$('md').style.display='none'}$('mx').onclick=closeMd;
function awaken(i){const a=S.aw[i];if(a>=3)return;if(S.stone<AWCOST[a]){toast('각성석이 부족해요');sfx('err');return}S.stone-=AWCOST[a];S.aw[i]++;sfx('up');toast('✨ '+CH[i].n+' '+S.aw[i]+'단계 각성! ['+AWK[i][S.aw[i]-1].n+']');save();rMd()}
function PVH(){return `<div class="sm">🏅 훈장 <b>${S.medal}개</b> · 라운드를 클리어할 때마다 +1<br>업그레이드 전에는 효과가 0%, 한 번 올리면 Lv.1이에요. 최대 Lv.${MAXP} · 비용은 (현재 레벨 + 1)개</div>`+PV.map((q,k)=>{const l=S.pv[k],mx=l>=MAXP,c=l+1;return `<div class="cd"><div style="font-size:1.8em;flex:none">${q.i}</div><div><b>${q.n}</b> Lv.${l}${mx?' (MAX)':''}<div class="sm">${q.d}</div><div class="sm ok">현재 +${l*q.p}%${mx?'':' → 다음 +'+(l+1)*q.p+'%'}</div></div>${mx?'<b>MAX</b>':`<button ${S.medal>=c?'':'disabled'} onclick="upPv(${k})"><b>🏅 ${c}</b><small>강화</small></button>`}</div>`}).join('')}
function upPv(k){const l=S.pv[k];if(l>=MAXP)return;if(S.medal<l+1){toast('훈장이 부족해요');sfx('err');return}S.medal-=l+1;S.pv[k]++;sfx('up');toast(PV[k].i+' '+PV[k].n+' Lv.'+S.pv[k]);rMd()}
function rMd(){let h='';const wtabs=`<div class="tabs"><button class="${MD=='w'?'on':''}" onclick="MD='w';rMd()">✨ 각성</button><button class="${MD=='p'?'on':''}" onclick="MD='p';rMd()">🏅 패시브</button></div>`;const tabs=`<div class="tabs"><button class="${MD=='a'?'on':''}" onclick="MD='a';rMd()">🐣 아군</button><button class="${MD=='e'?'on':''}" onclick="MD='e';rMd()">👾 적</button></div>`;
if(MD=='p'){$('mt').textContent='✨ 성장';h=wtabs+PVH()}
else if(MD=='w'){$('mt').textContent='✨ 성장';h=wtabs+`<div class="sm">💎 각성석 <b>${S.stone}개</b> · 5라운드를 클리어할 때마다 +1 (모든 캐릭터를 끝까지 각성할 수 있는 36개까지만 얻어요)<br>각성 비용 1개 → 3개 → 5개 (캐릭터마다 최대 3단계)<br>각성 단계는 캐릭터 아래 ★로 표시돼요. 기본 능력 수치는 그대로고 단계마다 능력이 누적돼요.</div>`+CH.map((c,i)=>{const a=S.aw[i];return `<div class="cd">${icon(i,48)}<div><b>${c.n}</b> <span style="color:#e6a800">${stars(a)}</span>${awl(i)}</div>${a<3?`<button ${S.stone>=AWCOST[a]?'':'disabled'} onclick="awaken(${i})"><b>💎 ${AWCOST[a]}</b><small>각성</small></button>`:'<b>MAX</b>'}</div>`}).join('')}
else if(MD=='a'){$('mt').textContent='📖 도감';h=tabs+CH.map((c,i)=>{const l=S.lv[i],a=S.aw[i],ex=['감속 장판(반경 44, 2.5초): 안의 적 '+pc(slowV(l))+' 감속'+(S.aw[0]>=2?' · 겹치면 곱연산으로 중첩':' · 겹쳐도 중첩 안 됨')+' (강화할수록 증가폭 감소)','치명타 확률 30% (피해 2배)','좌우 아군 공격력·속도 +'+pc(buffV(l))+' (최대 2.5배, 강화할수록 증가폭 감소)','반경 42 주변 적에게 70% 폭발 피해'][i];return `<div class="cd">${icon(i,48)}<div><b>${c.n}</b> Lv${l} <span style="color:#e6a800">${stars(a)}</span><br>${c.d}<div class="sm">공격력 ${Math.round(c.dmg*(1+.3*(l-1)))} (기본 ${c.dmg}) · 사거리 ${c.rng} · 공격 간격 ${c.cd}초</div><div class="sm">${ex}</div><div class="sm">모든 아군은 10% 확률로 치명타(피해 2배)</div><div class="sm"><b>각성</b></div>${awl(i)}</div></div>`}).join('')}
else{$('mt').textContent='📖 도감';const r=Math.max(1,S.round),hb=hpBase(r),E=[['일반 김지훈',mkE(4,hb,52,r),4,'매 라운드 등장 · 기본 적',''],['빠른 김지훈',mkE(5,hb*.6,95,r),5,'3라운드부터 약 45% 확률로 등장 · 체력이 낮고 매우 빠름',''],['보스 김지훈',mkE(4,hb*14,30,r,1),4,'5라운드마다 등장 · 체력 14배 · 느림 · 처치 보상 10배 · 5라운드 클리어 시 💎 각성석 획득(필요한 만큼 모이면 중단) · 기절 효과가 약함','filter:drop-shadow(0 0 5px red)']];
h=tabs+`<div class="sm">현재 라운드 ${r} 기준 수치 (라운드가 오를수록 강해져요)</div>`+E.map(([n,e,k,d,st])=>`<div class="cd"><img src="${IMS[k]}" style="height:${e.boss?56:40}px;${st}"><div><b>${n}</b><div class="sm">체력 ${Math.round(e.max)} · 이동속도 ${Math.round(e.spd)} · 성 피해 ${e.ld} · 처치 보상 ${e.rw}원</div><div class="sm">${d}</div><div class="sm">감속·빙결·기절 등 디버프가 통하고, 성에 닿으면 사라지며 성 체력이 줄어요</div></div></div>`).join('')}
$('mc').innerHTML=h}
let tk=0,MSG='';
function ui(){if(MO){const sg=MD+S.stone+'|'+S.medal+'|'+(MD=='e'?S.round:'');if(sg!=MSG){MSG=sg;rMd()}}$('r').textContent='라운드 '+S.round;$('m').innerHTML='💰 '+Math.floor(S.money)+'<br>💎 '+S.stone+'  🏅 '+S.medal;
const m=S.money;setb('bs','🎲 랜덤 소환',costSum()+'원',m>=costSum());setb('bc','🏰 성 강화',costCastle()+'원 (+50)',m>=costCastle());
setb('bn','▶ 시작','',!S.inRound);setb('bv','⏩ x'+S.speed,'',true);setb('bx','🔄 다시','',true);setb('bm',mute?'🔇':'🔊','',true);setb('bd','📖 도감','',true);setb('bp','⏸','',!S.over&&!MM);setb('ba','✨ 성장'+(S.aw.some((a,i)=>a<3&&S.stone>=AWCOST[a])||S.pv.some(v=>v<MAXP&&S.medal>=v+1)?' ❗':''),'',true);setb('bb','🎯 확률업',S.boost.n>0?CH[S.boost.t].n+' x'+S.boost.n:costBoost()+'원',m>=costBoost());
CH.forEach((c,i)=>{});
CH.forEach((c,i)=>setb('u'+i,c.n+(S.aw[i]?' '+'★'.repeat(S.aw[i]):''),'Lv'+S.lv[i]+' · '+costUp(i)+'원',m>=costUp(i)));
setb('k0','💥 폭격',costBomb()+'원',m>=costBomb());setb('k1','❄ 빙결',costIce()+'원',m>=costIce());setb('bl',S.buying?'✖ 취소':'⬆ 칸 해제',S.unlocked>=16?'최대':S.buying?'칸을 누르세요':costSlot()+'원',S.unlocked<16&&(S.buying||m>=costSlot()));setb('kh','💖 성 회복',S.hp>=S.hpMax?'가득':costHeal()+'원',S.hp<S.hpMax&&m>=costHeal());
const u=S.sel>=0&&S.slots[S.sel],sb=$('sell');if(u){const c=CH[u.t],l=S.lv[u.t];$('it').innerHTML=`<b>${c.n}${S.aw[u.t]?' '+'★'.repeat(S.aw[u.t]):''} Lv${l}</b> 공격 ${Math.round(c.dmg*(1+.3*(l-1)))}<br>${c.d}`;sb.style.display='flex';sb.textContent='🗑 제거'}else{$('it').textContent='아군을 눌러 선택 → 다른 칸을 누르면 이동·교체';sb.style.display='none'}}
let last=performance.now();
function loop(t){const dt=Math.min(.05,(t-last)/1000);last=t;if(!S.over&&!MM)if(S.speed<1)step(dt*S.speed);else for(let i=0;i<S.speed;i++)step(dt);draw();ui();tk+=dt;if(tk>3){tk=0;save()}requestAnimationFrame(loop)}
Promise.all(IMS.map(s=>new Promise(r=>{const i=new Image();i.onload=()=>r(i);i.src=s}))).then(a=>{IM=a;fresh();fit();rMm('main');new ResizeObserver(fit).observe($('cw'));requestAnimationFrame(loop)});
</script></body></html>
