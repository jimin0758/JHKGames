<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>사진 사격장</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#12202b;color:#fff;font-family:"Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif;user-select:none}
canvas{display:block}
#hud{position:fixed;inset:0;pointer-events:none;font-weight:700}
#hp{position:absolute;left:20px;top:18px;width:220px}
#hp i{display:block;height:22px;border-radius:11px;background:#e8433c;transform-origin:left;transition:transform .15s}
#hp b{display:block;position:relative;height:22px;border-radius:13px;background:rgba(0,0,0,.45);padding:2px;margin-top:4px}
#hpt{position:absolute;left:0;right:0;top:2px;line-height:22px;text-align:center;font-size:15px;text-shadow:0 1px 3px #000}
#sc{position:absolute;right:22px;top:14px;text-align:right;font-size:22px;text-shadow:0 2px 4px #0008}
#sc small{display:block;font-size:14px;opacity:.9}
#mo{color:#ffd23f}
#boss{display:none;position:absolute;left:50%;top:14px;transform:translateX(-50%);width:min(40vw,380px);height:16px;border-radius:8px;background:rgba(0,0,0,.55);overflow:hidden}
#boss i{display:block;height:100%;background:linear-gradient(90deg,#8e2de2,#e83cdc);transform-origin:left;transition:transform .1s}
#am{position:absolute;right:26px;bottom:20px;font-size:24px;text-shadow:0 2px 4px #0008}
#cr{position:absolute;left:50%;top:50%;width:26px;height:26px;margin:-13px 0 0 -13px}
#cr:before,#cr:after{content:"";position:absolute;background:#fff;box-shadow:0 0 3px #000}
#cr:before{left:12px;top:0;width:2px;height:26px}#cr:after{top:12px;left:0;height:2px;width:26px}
#cr.hit:before,#cr.hit:after{background:#ffd23f}
#fire,#rl,#sw,#ads{position:fixed;border:0;color:#fff;font-weight:800;font-family:inherit;touch-action:none;-webkit-tap-highlight-color:transparent}
#fire{right:24px;bottom:84px;width:92px;height:92px;border-radius:50%;background:rgba(232,67,60,.85);font-size:20px}
#fire:active{background:#ff7a72}
#rl,#sw,#ads{left:20px;padding:12px 18px;border-radius:10px;background:rgba(0,0,0,.5);font-size:16px}
#rl{bottom:24px}#sw{bottom:76px}#ads{bottom:128px}
#fl,#dm{position:fixed;inset:0;pointer-events:none;opacity:0}
#fl{background:#fff;transition:opacity .08s}#dm{background:radial-gradient(transparent 40%,#e8130c);transition:opacity .4s}
#bn{position:fixed;left:0;right:0;top:22%;text-align:center;font-size:56px;font-weight:900;opacity:0;pointer-events:none;text-shadow:0 4px 10px #0009;transition:opacity .5s}
.pop{position:fixed;pointer-events:none;font-weight:900;font-size:24px;color:#ffd23f;text-shadow:0 2px 4px #000;transform:translate(-50%,0);animation:up .8s forwards}
.pop.h{font-size:32px;color:#ff6b3d}.pop.g{color:#58e07a}
@keyframes up{to{transform:translate(-50%,-70px);opacity:0}}
#ov{position:fixed;inset:0;overflow:hidden;display:flex;align-items:center;justify-content:center;text-align:center;padding:20px;box-sizing:border-box;background:#14081f}
#ovbg{position:absolute;inset:0;background-size:cover;background-position:center;filter:saturate(1.1) brightness(.75);animation:pan 40s ease-in-out infinite alternate}
@keyframes pan{from{transform:scale(1.05)}to{transform:scale(1.18) translateX(-2%)}}
#ov:before{content:"";position:absolute;inset:0;z-index:1;background:radial-gradient(ellipse at center,rgba(10,5,25,.15),rgba(5,2,15,.85) 85%),linear-gradient(transparent 55%,rgba(5,2,12,.9))}
#mb{position:absolute;z-index:1;left:50%;bottom:-6%;height:78%;transform:translateX(-50%);opacity:.28;mix-blend-mode:screen;animation:br 5s ease-in-out infinite alternate;pointer-events:none}
@keyframes br{to{transform:translateX(-50%) scale(1.06);opacity:.4}}
#mobs{position:absolute;z-index:1;left:0;right:0;bottom:0;display:flex;justify-content:center;gap:2vw;pointer-events:none}
#mobs img{height:24vh;filter:brightness(.4) contrast(1.2) drop-shadow(0 0 10px #ff7a30);animation:fl 3s ease-in-out infinite alternate}
#mobs img:nth-child(even){animation-delay:-1.5s}
@keyframes fl{to{transform:translateY(-8px)}}
.mc{position:relative;z-index:2;max-width:640px}
.sub{letter-spacing:.5em;font-size:13px;color:#ffb27a;margin-bottom:6px}
#ov h1{font-size:clamp(44px,9vw,92px);margin:0 0 8px;letter-spacing:-2px;background:linear-gradient(#fff3c9,#ff9a3c 55%,#d8362a);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 4px 14px rgba(255,110,40,.55))}
#ov p{margin:6px 0;font-size:16px;line-height:1.6;color:#f1e4ff;text-shadow:0 2px 6px #000}
#ld{display:inline-block;padding:6px 16px;border-radius:20px;background:rgba(0,0,0,.45);border:1px solid rgba(255,210,63,.4);color:#ffd23f!important;font-weight:700}
#ov p.ct{font-size:13px;opacity:.8}
.row{display:flex;gap:12px;justify-content:center;align-items:center;margin:14px 0;flex-wrap:wrap}
.opt{padding:10px 20px;margin:4px;border-radius:10px;border:2px solid rgba(255,210,63,.8);background:rgba(0,0,0,.4);color:#fff;font-weight:700;font-size:17px;cursor:pointer;font-family:inherit;backdrop-filter:blur(4px)}
.opt.on{background:#ffd23f;color:#111;box-shadow:0 0 16px rgba(255,210,63,.6)}
#go{padding:12px 46px;font-size:24px;font-weight:900;border:0;border-radius:12px;background:linear-gradient(#ffd23f,#ff9a1f);color:#2a1500;cursor:pointer;font-family:inherit;animation:pl 1.6s ease-in-out infinite}
@keyframes pl{50%{box-shadow:0 0 28px rgba(255,170,40,.85)}}
#go:disabled{opacity:.5;cursor:wait;animation:none}
.em{position:absolute;z-index:1;bottom:-10px;width:4px;height:4px;border-radius:50%;background:#ffb060;box-shadow:0 0 6px #ff8a2a;opacity:0;animation:rs linear infinite;pointer-events:none}
@keyframes rs{0%{transform:translateY(0);opacity:0}10%{opacity:.9}100%{transform:translateY(-105vh) translateX(30px);opacity:0}}
#shop{position:fixed;inset:0;display:none;overflow:auto;box-sizing:border-box;padding:12px 14px;text-align:center;background:linear-gradient(#55504b,#3a3633 60%,#2a2724)}
.top{display:flex;justify-content:space-between;align-items:center;max-width:980px;margin:0 auto 12px;font-weight:800;font-size:22px}
.wood{background:repeating-linear-gradient(90deg,#b98150 0 7px,#c48c58 7px 14px,#ad7646 14px 19px)}
.rack{max-width:980px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);border:6px solid #8a5a30;border-bottom:0;border-radius:6px 6px 0 0;box-shadow:inset 0 0 30px #0007;background:repeating-linear-gradient(90deg,#b98150 0 7px,#c48c58 7px 14px,#ad7646 14px 19px)}
.rc{height:min(42vh,320px);border-left:8px solid #8a5a30;display:flex;align-items:flex-end;justify-content:center;padding:10px 0}
.rc:first-child{border-left:0}
.rc svg{height:100%;filter:drop-shadow(3px 4px 3px #0008)}
.rc.on svg{filter:drop-shadow(0 0 8px #ffd23f)}
.ctr{max-width:980px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);background:linear-gradient(#7a5030,#5b3a22);border:6px solid #8a5a30;border-top:12px solid #c79a64;padding:12px 4px;border-radius:0 0 8px 8px}
.cc{display:flex;flex-direction:column;align-items:center;gap:5px;padding:0 5px;font-size:13px}
.cc .nm{font-weight:800;font-size:15px}.cc small{opacity:.85;line-height:1.35}
.tag{background:#f4f1ea;border-radius:4px;width:100%;max-width:140px;color:#222;box-shadow:0 2px 4px #0006;overflow:hidden}
.tag small{display:block;font-size:11px;font-weight:700;padding:3px 0;opacity:1}
.tag b{display:block;background:#f2a413;color:#3a2200;font-size:15px;padding:3px 0}
.tag b.own{background:#3fae5a;color:#fff}
.hub{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;max-width:760px;margin:40px auto}
.hb{border:6px solid #8a5a30;border-radius:8px;padding:12px;color:#2b1b0e;font-weight:800;font-size:20px;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;font-family:inherit;background:repeating-linear-gradient(90deg,#b98150 0 7px,#c48c58 7px 14px,#ad7646 14px 19px)}
.hi{height:120px}.hi svg{height:100%;filter:drop-shadow(2px 3px 2px #0006)}.hb small{font-size:14px;color:#3a2410}
.b{padding:8px 12px;border:0;border-radius:8px;background:#ffd23f;color:#111;font-weight:800;font-size:15px;cursor:pointer;font-family:inherit}
.b:disabled{opacity:.4;cursor:default}
#quit{position:fixed;left:252px;top:20px;padding:6px 14px;border:0;border-radius:8px;background:rgba(0,0,0,.5);color:#fff;font-weight:800;font-size:14px;font-family:inherit;touch-action:none}
#qm{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(5,5,15,.7);z-index:20}
#qm .box{background:#1d2a3a;border-radius:14px;padding:22px 26px;text-align:center;max-width:320px;box-shadow:0 8px 30px #000a}
#qm .box b{font-size:22px}#qm .box p{font-size:14px;opacity:.85;margin:8px 0 4px}
#hud{z-index:5}#fire,#rl,#sw,#ads,#quit{z-index:5}#ov,#shop{z-index:10}
#scp,#rd{position:fixed;inset:0;pointer-events:none;opacity:0;transition:opacity .12s;z-index:3}
#scm{position:absolute;inset:0;background:radial-gradient(circle at 50% 50%,transparent 0,transparent 37vmin,rgba(0,0,0,.6) 38vmin,#000 41vmin)}
#scl{position:absolute;left:50%;top:50%;width:76vmin;height:76vmin;margin:-38vmin 0 0 -38vmin;border-radius:50%;box-shadow:inset 0 0 8vmin 3vmin rgba(0,0,0,.5),0 0 0 .8vmin #0a0a0a;background:radial-gradient(circle,rgba(150,200,255,.05),rgba(0,0,0,0) 70%)}
#scr{position:absolute;left:50%;top:50%;width:76vmin;height:76vmin;margin:-38vmin 0 0 -38vmin}
#rd:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 50%,transparent 38%,rgba(0,0,0,.4))}
#rd svg{position:absolute;left:50%;top:50%;width:40vmin;height:40vmin;margin:-20vmin 0 0 -20vmin;filter:drop-shadow(0 0 2px #f00)}
</style></head><body>
<div id="hud">
 <div id="hp"><b><i id="hpb"></i><span id="hpt"></span></b></div>
 <div id="sc"><span id="s"></span><small id="w"></small><small id="mo"></small></div>
 <div id="boss"><i id="bb"></i></div>
 <div id="am"></div><div id="cr"></div>
</div>
<button id="quit">나가기</button><button id="fire">발사</button><button id="ads">조준</button><button id="sw">무기</button><button id="rl">재장전</button>
<div id="fl"></div><div id="dm"></div><div id="bn"></div>
<div id="scp"><div id="scm"></div><div id="scl"></div><svg id="scr" viewBox="-50 -50 100 100" xmlns="http://www.w3.org/2000/svg"></svg></div>
<div id="rd"><svg viewBox="-50 -50 100 100" xmlns="http://www.w3.org/2000/svg"><circle r="7" fill="none" stroke="#ff2a2a" stroke-width=".5"/><circle r="1" fill="#ff2a2a"/></svg></div>
<div id="qm"><div class="box"><b>게임을 나갈까요?</b><p>번 돈은 저장됩니다. 진행 중인 웨이브는 사라집니다.</p><div class="row"><button class="opt" id="qc">계속하기</button><button class="opt" id="qx">나가기</button></div></div></div>
<div id="ov"><div id="ovbg"></div><img id="mb" alt=""><div id="mobs"></div>
 <div class="mc"><div class="sub">PHOTO SHOOTING RANGE</div><h1 id="t">사진 사격장</h1>
  <p id="d">난이도를 고르고, 상점에서 총·탄창·스코프를 준비한 뒤 시작하세요.<br>웨이브를 깨면 돈을 얻고, 10웨이브마다 보스가 나옵니다.</p>
  <div id="df"></div><p id="ld"></p>
  <div class="row"><button class="opt" id="shopb">🏪 상점</button><button id="go" disabled>불러오는 중…</button></div>
  <p class="ct">드래그: 화면 회전 · 탭/클릭·발사 버튼: 발사 · R: 재장전 · 1~4/Q: 무기 변경<br>Z/우클릭/조준 버튼: 스코프 줌 · 십자가 상자: 체력 +25 · 헤드샷 2배 피해</p><button class="opt" id="rst" style="font-size:13px;padding:6px 12px;opacity:.85">진행 초기화</button></div></div>
<div id="shop"></div>

 if(e.hp<=0){kill(e,head);return}
 e.s.material.color.set(0xff8888);setTimeout(()=>{if(!e.dead)e.s.material.color.set(e.stun>0?0xffff66:0xffffff)},70);tone(300,.05,'square',.05,200);if(e.boss)updBoss()}
/* ---------- 조작 ---------- */
function reload(){const w=WP[cur];if(reloading>0||w.am>=mag(w))return;reloading=w.rl*MAGS[inv.m].rl;tone(800,.05,'square',.04,500);hud()}
function shoot(){
 const w=WP[cur];if(state!=='play'||cool>0||reloading>0)return;
 if(w.am<=0){reload();return}
 w.am--;cool=w.cd;recoil=w.rc;SFX[cur]();$('fl').style.opacity=.25;setTimeout(()=>$('fl').style.opacity=0,60);
 const alive=enemies.filter(e=>!e.dead),objs=alive.map(e=>e.s);
 const sf=ads?.5:1;for(let p=0;p<w.pel;p++){ray.setFromCamera({x:(rnd()*2-1)*w.sp*sf,y:(rnd()*2-1)*w.sp*sf},cam);
  const h=ray.intersectObjects(objs);for(let k=0,n=0,seen=[];k<h.length&&n<(w.pierce||1);k++){const e=alive.find(e=>e.s===h[k].object);if(seen.includes(e))continue;seen.push(e);n++;hitE(e,h[k].point.y,dmg(w))}}
 hud();if(w.am===0)reload()}
function swi(i){if(!WP[i]||!WP[i].own||i===cur||state!=='play')return;cur=i;reloading=0;cool=.25;tone(500,.06,'square',.05,800);hud()}
function swNext(){for(let k=1;k<=WP.length;k++){const i=(cur+k)%WP.length;if(WP[i].own){swi(i);return}}}
function hurt(n){hp-=n;tone(130,.25,'sawtooth',.1,50);$('dm').style.opacity=1;setTimeout(()=>$('dm').style.opacity=0,150);hud();
 if(hp<=0){state='over';down=false;save();if(score>best){best=score;try{localStorage.setItem('best2',best)}catch(e){}}
  $('boss').style.display='none';$('t').textContent='게임 오버';$('d').textContent=score+'점 · 웨이브 '+wave+' 도달 (최고 '+best+'점) · 난이도를 바꿔 다시 도전하세요';$('go').textContent='다시 시작';$('ov').style.display='flex';ld()}}
/* ---------- 상점(메뉴) ---------- */
let view='hub';
function openShop(v){view=v;$('shop').style.display='block';renderShop()}
const ld=()=>{$('ld').textContent='💰 '+money+' · '+WP[inv.g].n+' · '+MAGS[inv.m].n+' · '+SCOPES[inv.s].n+' · '+SKINS[inv.k].n};
const SHOP={g:{t:'총 상점',L:WP,own:'gOwn',eq:'g',ic:GSV,st:g=>'데미지 '+g.d+' · 탄창 '+g.mag+(g.pel>1?' · 펠릿 '+g.pel:'')+(g.pierce?' · 관통 '+g.pierce:'')+'<br>'+g.tip},
 m:{t:'탄창 상점',L:MAGS,own:'mOwn',eq:'m',ic:MSV,st:g=>'용량 ×'+g.m+'<br>재장전 '+(g.rl>1?'+'+Math.round((g.rl-1)*100)+'%':'기본')},
 s:{t:'스코프 상점',L:SCOPES,own:'sOwn',eq:'s',ic:SSV,st:g=>g.z>1?'줌 ×'+g.z+'<br>Z/우클릭 조준':'줌 없음'}};
SHOP.k={t:'스킨 상점',L:SKINS,own:'kOwn',eq:'k',ic:[],st:g=>g.p?'모든 총에 적용 · 3D 반영':'기본 색상'};
function renderShop(){SHOP.k.ic=SKINS.map((k,i)=>recolor(GSV[inv.g],k,i));SHOP.s.ic=SSV.map((v,i)=>recolor(v,SKINS[inv.k],20+i));let h='<div class="top"><button class="b" data-a="back">◀ 뒤로</button><span>'+(view==='hub'?'상점':SHOP[view].t)+'</span><span style="color:#ffd23f">💰 '+money+'</span></div>';
 if(view==='hub'){h+='<div class="hub">';for(const k of['g','m','s','k']){const S=SHOP[k];h+='<button class="hb" data-a="v'+k+'"><div class="hi">'+S.ic[inv[S.eq]]+'</div><b>'+S.t+'</b><small>장착: '+S.L[inv[S.eq]].n+'</small></button>'}h+='</div>'}
 else{const S=SHOP[view];let r='',c='';S.L.forEach((it,i)=>{const own=inv[S.own][i],eq=inv[S.eq]===i;
  r+='<div class="rc'+(eq?' on':'')+'">'+S.ic[i]+'</div>';
  c+='<div class="cc"><div class="tag"><small>Price</small><b class="'+(own?'own':'')+'">'+(own?'보유':'💰'+it.cost)+'</b></div><div class="nm">'+it.n+'</div><small>'+S.st(it)+'</small>'+
   '<button class="b" data-a="'+(own?'e':'b')+i+'"'+(eq||(!own&&money<it.cost)?' disabled':'')+'>'+(eq?'장착 중':own?'장착':'구매')+'</button></div>'});
  h+='<div class="rack">'+r+'</div><div class="ctr">'+c+'</div>'}
 $('shop').innerHTML=h}
$('shop').onclick=e=>{const t=e.target.closest('[data-a]');if(!t)return;const a=t.dataset.a;
 if(a==='back'){if(view==='hub'){$('shop').style.display='none';$('ov').style.display='flex';ld()}else{view='hub';renderShop()}return}
 if(a[0]==='v'){view=a[1];renderShop();return}
 const S=SHOP[view],i=+a.slice(1);
 if(a[0]==='b'&&!inv[S.own][i]&&money>=S.L[i].cost){money-=S.L[i].cost;inv[S.own][i]=1;inv[S.eq]=i}
 else if(a[0]==='e'&&inv[S.own][i])inv[S.eq]=i;
 save();resetWP();cur=inv.g;hud();renderShop()};
$('shopb').onclick=()=>{$('ov').style.display='none';openShop('hub')};
let rstArm=0;$('rst').onclick=()=>{const b=$('rst');
 if(!rstArm){rstArm=1;b.textContent='한 번 더 누르면 모든 진행이 초기화됩니다';setTimeout(()=>{rstArm=0;b.textContent='진행 초기화'},3000);return}
 rstArm=0;b.textContent='진행 초기화';try{localStorage.removeItem('ps5');localStorage.removeItem('best2')}catch(e){}
 inv=freshInv();money=inv.money;best=0;cur=0;resetWP();hud();ld()};
/* ---------- 루프 ---------- */
function step(dt){
 cool-=dt;const w=WP[cur];if(down&&w.auto)shoot();
 if(reloading>0){reloading-=dt;if(reloading<=0){w.am=mag(w);tone(500,.05,'square',.04,800);hud()}}
 packT-=dt;if(packT<=0){spawnPack();packT=14+rnd()*10}
 if(left>0){spawnT-=dt;if(spawnT<=0){spawn();left--;spawnT=Math.max(.5,1.5-.08*wave)/D.n}}
 else if(enemies.every(e=>e.pack)){if(!wave)nextWave();else if(wt<0){const b=Math.round((50+15*wave)*D.mo);money+=b;banner('웨이브 클리어! +💰'+b);WP.forEach(g=>g.am=mag(g));reloading=0;wt=2.5;save();hud()}else if((wt-=dt)<=0)nextWave()}
 for(let i=enemies.length-1;i>=0;i--){const e=enemies[i],s=e.s;
  if(e.dead){e.dead+=dt;const m=e.pack,k=Math.min(1,e.dead/.45),f=Math.max(0,(e.dead-(m?0:1.1))/.5);
   if(m)s.position.y+=dt*2;else{s.material.rotation=e.dir*k*1.45;s.material.color.setRGB(1,1-.75*k,1-.75*k)}
   s.material.opacity=1-f;if(e.sh)e.sh.scale.setScalar(Math.max(.01,e.sc*(1-f)));
   if(f>=1){drop(e);enemies.splice(i,1)}continue}
  const d=Math.hypot(s.position.x,s.position.z),v=e.spd*(.25+1.75*Math.min(1,d/40))*dt/d;
  if(e.pack){s.position.x-=s.position.x*v;s.position.z-=s.position.z*v;e.ph+=dt*3;s.position.y=.5+Math.sin(e.ph)*.15;
   if(d<2){drop(e);enemies.splice(i,1)}continue}
  if(e.boss){e.t+=dt;
   if(e.stun>0){e.stun-=dt;s.material.rotation=Math.sin(e.t*30)*.03;if(e.stun<=0){s.material.color.setRGB(1,1,1);s.material.rotation=0;updBoss()}}
   else{if(d>24){const q=3*D.sp*dt/d;s.position.x-=s.position.x*q;s.position.z-=s.position.z*q;e.sh.position.x=s.position.x;e.sh.position.z=s.position.z}
    e.sum-=dt;if(e.sum<=0){summon(e);e.sum=Math.max(3,6-e.t/25)}}
   e.ph+=dt*2;s.position.y=Math.sin(e.ph)*.15;continue}
  s.position.x-=s.position.x*v;s.position.z-=s.position.z*v;
  e.ph+=dt*9;s.position.y=Math.abs(Math.sin(e.ph))*.15;s.material.rotation=Math.sin(e.ph)*.06;
  e.sh.position.x=s.position.x;e.sh.position.z=s.position.z;
  if(d<2){drop(e);enemies.splice(i,1);hurt(12*D.dm)}}}
function start(){
 setBossBg(false);enemies.splice(0).forEach(drop);resetWP();cur=inv.g;ads=false;wt=-1;packT=10+rnd()*5;hp=MAXHP;score=0;wave=0;reloading=0;left=0;yaw=0;pitch=0;cam.rotation.set(0,0,0);state='play';
 $('ov').style.display='none';$('shop').style.display='none';$('boss').style.display='none';hud()}
$('go').onclick=start;
const D0=$('d').innerHTML;
function pauseQ(){if(state!=='play')return;state='pause';down=false;ads=false;$('qm').style.display='flex'}
function contQ(){$('qm').style.display='none';state='play'}
$('quit').onclick=pauseQ;$('qc').onclick=contQ;
$('qx').onclick=()=>{$('qm').style.display='none';save();setBossBg(false);enemies.splice(0).forEach(drop);$('boss').style.display='none';state='menu';
 $('t').textContent='사진 사격장';$('d').innerHTML=D0;$('go').textContent='시작';$('ov').style.display='flex';ld()};
const df=$('df');Object.keys(DIF).forEach(k=>{const b=document.createElement('button');b.className='opt'+(k===dif?' on':'');b.textContent=k;
 b.onclick=()=>{dif=k;D=DIF[k];[...df.children].forEach(c=>c.classList.toggle('on',c===b))};df.appendChild(b)});
const cv=ren.domElement;cv.style.touchAction='none';let drag=null;
cv.addEventListener('pointerdown',e=>{if(state!=='play')return;cv.setPointerCapture(e.pointerId);drag={id:e.pointerId,x:e.clientX,y:e.clientY,moved:0,t:performance.now()}});
cv.addEventListener('pointermove',e=>{if(!drag||e.pointerId!==drag.id)return;
 const dx=e.clientX-drag.x,dy=e.clientY-drag.y;drag.x=e.clientX;drag.y=e.clientY;drag.moved+=Math.abs(dx)+Math.abs(dy);
 yaw=Math.max(-1.3,Math.min(1.3,yaw-dx*.0045/zoom));pitch=Math.max(-.5,Math.min(.5,pitch-dy*.0045/zoom));cam.rotation.set(pitch,yaw,0)});
cv.addEventListener('pointerup',e=>{if(drag&&e.pointerId===drag.id){if(drag.moved<8&&performance.now()-drag.t<300)shoot();drag=null}});
cv.addEventListener('pointercancel',()=>drag=null);
const fb=$('fire');fb.addEventListener('pointerdown',e=>{e.preventDefault();down=true;shoot()});
['pointerup','pointerleave','pointercancel'].forEach(n=>fb.addEventListener(n,()=>down=false));
$('rl').addEventListener('pointerdown',e=>{e.preventDefault();reload()});
const tgAds=()=>{if(state==='play')ads=!ads};cv.addEventListener('contextmenu',e=>{e.preventDefault();tgAds()});
$('ads').addEventListener('pointerdown',e=>{e.preventDefault();tgAds()});
$('sw').addEventListener('pointerdown',e=>{e.preventDefault();swNext()});
addEventListener('keydown',e=>{const k=e.key.toLowerCase();if(k==='escape'){state==='pause'?contQ():pauseQ()}else if(k==='r'||k==='ㄱ')reload();else if(k==='q'||k==='ㅂ')swNext();else if(k>='1'&&k<='4')swi(+k-1);else if(k==='z'||k==='ㅋ')tgAds();else if(k===' '){e.preventDefault();shoot()}});
addEventListener('resize',()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();ren.setSize(innerWidth,innerHeight)});
function setReticle(){const hi=inv.s===3,tk=hi?24:18,th=hi?.22:.3,tkw=hi?1.1:1.6,D=[[1,0],[-1,0],[0,1],[0,-1]];let h='<g stroke="#0a0a0a">';
 for(const[x,y]of D)h+='<line x1="'+x*tk+'" y1="'+y*tk+'" x2="'+x*49+'" y2="'+y*49+'" stroke-width="'+tkw+'"/><line x1="'+x*2.5+'" y1="'+y*2.5+'" x2="'+x*tk+'" y2="'+y*tk+'" stroke-width="'+th+'"/>';
 h+='</g><g fill="#0a0a0a">';for(let d=hi?4:6;d<tk;d+=hi?4:6)for(const[x,y]of D)h+='<circle cx="'+x*d+'" cy="'+y*d+'" r="'+(hi?.35:.5)+'"/>';
 $('scr').innerHTML=h+'</g><circle r=".45" fill="#ff2a2a"/>'}
let scopeMode=0,swaying=false;
function loop(){const dt=Math.min(clock.getDelta(),.05);if(state==='play')step(dt);
 fires.forEach(l=>{if(l.isLight)l.intensity=1.1+rnd()*.7;else l.scale.y=.8+rnd()*.5});
 if(state!=='play')ads=false;zoom+=((ads?ZOOM():1)-zoom)*Math.min(1,dt*10);const fv=70/zoom;if(Math.abs(cam.fov-fv)>.01){cam.fov=fv;cam.updateProjectionMatrix()}
 const sc=inv.s,zs=ads&&sc>=2&&zoom>1+(ZOOM()-1)*.6,rm=ads&&sc===1&&zoom>1.1,md=zs?2:rm?1:0;
 if(md!==scopeMode){scopeMode=md;$('scp').style.opacity=md===2?1:0;$('rd').style.opacity=md===1?1:0;$('cr').style.visibility=md?'hidden':'visible';gunRoot.visible=md!==2;if(md===2)setReticle()}
 if(state==='play'&&ads&&sc>=2){const tt=performance.now()/1000;cam.rotation.set(pitch+Math.sin(tt*1.7)*.0012,yaw+Math.cos(tt*1.3)*.0012,0);swaying=true}else if(swaying){cam.rotation.set(pitch,yaw,0);swaying=false}
 recoil+=(0-recoil)*Math.min(1,dt*14);gunRoot.position.z=-.55+recoil;gunRoot.rotation.x=recoil*1.5;
 if(state==='play'||state==='pause')ren.render(scene,cam);requestAnimationFrame(loop)}
$('ovbg').style.backgroundImage='url('+PANO+')';$('mb').src=BOSS;
IMGS.forEach(u=>{const i=new Image();i.src=u;$('mobs').appendChild(i)});
for(let k=0;k<22;k++){const e=document.createElement('i');e.className='em';e.style.cssText='left:'+rnd()*100+'%;animation-duration:'+(6+rnd()*8)+'s;animation-delay:'+(-rnd()*10)+'s';$('ov').appendChild(e)}
hud();ld();loop();
</script></body></html>
