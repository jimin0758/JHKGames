<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>알까기</title>
<style>
:root{--bg:#f3ecdf;--fg:#2b2016;--card:#fffaf0;--line:#d8c9ab;--acc:#2f6fed;--red:#e5484d;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1a140d;--fg:#f2e8d6;--card:#2a2217;--line:#4a3d29}}
:root[data-theme="dark"]{--bg:#1a140d;--fg:#f2e8d6;--card:#2a2217;--line:#4a3d29}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:"Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif}
button{font:inherit;color:inherit;cursor:pointer}
#menu{max-width:440px;margin:0 auto;padding:20px 18px 28px}
h1{font-size:34px;margin:6px 0 2px;letter-spacing:-1px}
.sub{margin:0 0 18px;opacity:.7;font-size:14px}
h2{font-size:15px;margin:18px 0 8px}
.row{display:flex;gap:8px}
.opt{flex:1;background:var(--card);border:2px solid var(--line);border-radius:12px;padding:10px 6px;font-weight:600;font-size:15px}
.opt.on{border-color:var(--acc);box-shadow:0 0 0 2px var(--acc) inset}
.opt img{width:76px;height:76px;display:block;margin:0 auto 4px;border-radius:50%}
.go{width:100%;margin-top:24px;padding:15px;border:0;border-radius:14px;background:var(--acc);color:#fff;font-size:18px;font-weight:700}
#game{display:none;height:100dvh;flex-direction:column;align-items:center}
#hud{width:min(100vw,560px);padding:10px 14px 6px;box-sizing:border-box;display:flex;align-items:center;justify-content:space-between;gap:8px}
#score{font-size:20px;font-weight:800}
#msg{font-size:14px;opacity:.85;min-height:20px;text-align:center;padding:0 14px}
.sm{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:6px 12px;font-size:13px}
#wrap{position:relative;width:min(100vw,calc(100dvh - 120px),640px);aspect-ratio:1}
canvas{width:100%;height:100%;display:block;touch-action:none;border-radius:10px;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;outline:none}
#over{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:rgba(20,12,4,.72);color:#fff;border-radius:10px}
#over b{font-size:40px}
#over .row{width:80%}
</style></head><body>

const imgs=IMGS.map(s=>{const i=new Image();i.src=s;return i});
document.getElementById("p0").src=IMGS[0];document.getElementById("p1").src=IMGS[1];
const S={pick:"0",diff:"1",first:"me"};
document.querySelectorAll("[data-g]").forEach(b=>b.onclick=()=>{const g=b.dataset.g;
 document.querySelectorAll('[data-g="'+g+'"]').forEach(x=>x.classList.toggle("on",x===b));S[g]=b.dataset.v});
const $=id=>document.getElementById(id),cv=$("cv"),cx=cv.getContext("2d"),dpr=Math.min(devicePixelRatio||1,2);
cv.width=cv.height=CW*dpr;
let stones=[],turn=0,phase="menu",drag=null,hl=null,frames=0,gid=0,hitstop=0,shake=0;
const fx=[],rings=[],texts=[];

function step(a,ev){
 for(const s of a){
  s.x+=s.vx;s.y+=s.vy;
  if(!s.alive){s.vx*=.96;s.vy*=.96;s.k*=.93;continue}
  s.vx*=FR;s.vy*=FR;
  if(s.vx*s.vx+s.vy*s.vy<.01){s.vx=s.vy=0}
  if(s.x<0||s.x>W||s.y<0||s.y>W)s.alive=false;
 }
 for(let i=0;i<a.length;i++){const p=a[i];if(!p.alive)continue;
  for(let j=i+1;j<a.length;j++){const q=a[j];if(!q.alive)continue;
   const dx=q.x-p.x,dy=q.y-p.y,d=Math.hypot(dx,dy);
   if(d<2*R&&d>0){const nx=dx/d,ny=dy/d,o=(2*R-d)/2;
    p.x-=nx*o;p.y-=ny*o;q.x+=nx*o;q.y+=ny*o;
    const rv=(p.vx-q.vx)*nx+(p.vy-q.vy)*ny;
    if(rv>0){const im=rv*.95;p.vx-=im*nx;p.vy-=im*ny;q.vx+=im*nx;q.vy+=im*ny;if(ev)ev(p,q,rv)}}}}
}
const still=a=>a.every(s=>!s.alive||(s.vx===0&&s.vy===0));

function startGame(){
 gid++;drag=null;hl=null;fx.length=0;rings.length=0;texts.length=0;hitstop=0;shake=0;initAudio();
 stones=[];
 for(const t of [0,1])for(let i=0;i<5;i++)
  stones.push({x:60+i*120,y:t?90:W-90,vx:0,vy:0,team:t,alive:true,k:1,img:t?1-S.pick:+S.pick});
 turn=S.first==="me"?0:S.first==="com"?1:(Math.random()<.5?0:1);
 $("over").style.display="none";
 $("menu").style.display="none";$("game").style.display="flex";
 beginTurn();
}
function counts(){return[0,1].map(t=>stones.filter(s=>s.team===t&&s.alive).length)}
function beginTurn(){
 const c=counts();$("score").textContent="나 "+c[0]+" : "+c[1]+" 컴퓨터";
 hl=null;
 if(turn===0){phase="aim";$("msg").textContent="내 차례 — 내 알을 뒤로 당겼다 놓으세요"}
 else{phase="ai";$("msg").textContent="컴퓨터 차례…";const g=gid;setTimeout(()=>{if(g===gid&&phase==="ai")aiMove()},600)}
}
function shoot(s,dx,dy,power){const l=Math.hypot(dx,dy)||1;s.vx=dx/l*power*MAXV;s.vy=dy/l*power*MAXV;phase="move";frames=0;sfx.shoot(power);shake=Math.max(shake,2+power*3)}
function afterShot(){
 const c=counts();$("score").textContent="나 "+c[0]+" : "+c[1]+" 컴퓨터";
 if(c[0]===0||c[1]===0){phase="over";
  $("ot").textContent=c[0]===c[1]?"무승부":c[1]===0?"승리!":"패배";
  $("msg").textContent="";$("over").style.display="flex";sfx.end(c[1]===0&&c[0]>0);return}
 turn=1-turn;beginTurn();
}

/* 컴퓨터 */
function simulate(idx,dx,dy,pw){
 const a=stones.map(s=>({...s}));const l=Math.hypot(dx,dy)||1;
 a[idx].vx=dx/l*pw*MAXV;a[idx].vy=dy/l*pw*MAXV;
 for(let n=0;n<500;n++){step(a);if(n>1&&still(a))break}
 let sc=0;a.forEach((s,i)=>{if(!s.alive&&stones[i].alive)sc+=s.team===1?-12:10});
 const sh=a[idx];if(sh.alive){let m=1e9;a.forEach(s=>{if(s.alive&&s.team===0)m=Math.min(m,Math.hypot(s.x-sh.x,s.y-sh.y))});if(m<1e9)sc-=m/1000}
 return sc;
}
function aiMove(){
 const mine=[],foes=[];stones.forEach((s,i)=>{if(s.alive)(s.team===1?mine:foes).push(i)});
 const rnd=(a,b)=>a+Math.random()*(b-a),pick=a=>a[Math.floor(Math.random()*a.length)];
 if(!mine.length||!foes.length){afterShot();return}
 let best=null;
 const cand=(m,f,off,pw)=>{const A=stones[m],B=stones[f],ang=Math.atan2(B.y-A.y,B.x-A.x)+off;return{m,dx:Math.cos(ang),dy:Math.sin(ang),pw}};
 if(S.diff==="0"){best=cand(pick(mine),pick(foes),rnd(-.35,.35),rnd(.3,.9))}
 else{
  let list=[];
  if(S.diff==="1"){for(let i=0;i<24;i++)list.push(cand(pick(mine),pick(foes),rnd(-.1,.1),rnd(.45,1)))}
  else{for(const m of mine)for(const f of foes)for(const pw of[.4,.55,.7,.85,1])for(const o of[0,-.04,.04])list.push(cand(m,f,o,pw))}
  let bs=-1e9,k=0;const g0=gid;
  const work=()=>{if(g0!==gid)return;const t0=performance.now();
   while(k<list.length&&performance.now()-t0<8){const c=list[k++],sc=simulate(c.m,c.dx,c.dy,c.pw);if(sc>bs){bs=sc;best=c}}
   if(k<list.length){setTimeout(work,0);return}
   if(S.diff==="1"){const a=Math.atan2(best.dy,best.dx)+rnd(-.05,.05);best={...best,dx:Math.cos(a),dy:Math.sin(a)}}
   fire(best)};
  work();return
 }
 fire(best);
 function fire(best){hl=stones[best.m];const g=gid;setTimeout(()=>{if(g!==gid)return;hl=null;shoot(stones[best.m],best.dx,best.dy,best.pw)},550)}
}

/* 입력 */
function pos(e){const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width*CW-M,y:(e.clientY-r.top)/r.height*CW-M}}
cv.addEventListener("pointerdown",e=>{
 if(phase!=="aim")return;const p=pos(e);let b=null,bd=R*1.5;
 for(const s of stones)if(s.alive&&s.team===0){const d=Math.hypot(s.x-p.x,s.y-p.y);if(d<bd){bd=d;b=s}}
 if(b){drag={s:b,x:p.x,y:p.y};cv.setPointerCapture(e.pointerId)}
});
cv.addEventListener("pointermove",e=>{if(drag){const p=pos(e);drag.x=p.x;drag.y=p.y;drag.edge=e.clientX<=4||e.clientY<=4||e.clientX>=innerWidth-5||e.clientY>=innerHeight-5}});
cv.addEventListener("pointerup",()=>{
 if(!drag)return;const d=drag;drag=null;
 const dx=d.s.x-d.x,dy=d.s.y-d.y,l=Math.hypot(dx,dy);
 if(l<14||phase!=="aim")return;
 shoot(d.s,dx,dy,d.edge?1:Math.min(l,MAXD)/MAXD);
});
cv.addEventListener("pointercancel",()=>{drag=null});

/* 그리기 */
const spr={};
function sprite(i,t){const k=i+"-"+t;if(spr[k])return spr[k];const im=imgs[i];if(!im.complete||!im.naturalWidth)return null;
 const S2=Math.ceil((R*2+14)*dpr),c=document.createElement("canvas");c.width=c.height=S2;const x=c.getContext("2d"),m=S2/2,r=R*dpr;
 x.beginPath();x.arc(m+dpr,m+4*dpr,r,0,7);x.fillStyle="rgba(0,0,0,.3)";x.fill();
 x.beginPath();x.arc(m,m,r,0,7);x.fillStyle="#f1e7d0";x.fill();
 x.save();x.beginPath();x.arc(m,m,r-3*dpr,0,7);x.clip();x.drawImage(im,m-r,m-r,2*r,2*r);x.restore();
 x.beginPath();x.arc(m,m,r-2*dpr,0,7);x.lineWidth=5*dpr;x.strokeStyle=t?"#e5484d":"#2f6fed";x.stroke();
 return spr[k]=c}
function drawStone(s){
 const x=s.x+M,y=s.y+M,r=R*s.k;if(r<1)return;
 const sp=sprite(s.img,s.team);
 if(sp){const w=sp.width/dpr*s.k;cx.drawImage(sp,x-w/2,y-w/2,w,w)}
 else{cx.beginPath();cx.arc(x,y,r,0,7);cx.fillStyle=s.team?"#e5484d":"#2f6fed";cx.fill()}
 if(s===hl||(phase==="aim"&&s.team===0&&s.alive&&!drag)){cx.beginPath();cx.arc(x,y,r+4,0,7);cx.lineWidth=2;cx.strokeStyle=s===hl?"#fff":"rgba(255,255,255,.55)";cx.stroke()}
}
function draw(){
 cx.setTransform(dpr,0,0,dpr,0,0);
 if(shake>.3){cx.translate(Math.sin(performance.now()/18)*shake*.5,Math.cos(performance.now()/23)*shake*.5);shake*=.88}else shake=0;
 cx.fillStyle="#6e4520";cx.fillRect(-30,-30,CW+60,CW+60);
 const g=cx.createLinearGradient(M,M,M+W,M+W);g.addColorStop(0,"#e6b96c");g.addColorStop(1,"#d3a050");
 cx.fillStyle=g;cx.fillRect(M,M,W,W);
 cx.strokeStyle="rgba(80,50,15,.55)";cx.lineWidth=1;
 for(let i=0;i<=9;i++){const v=M+i*W/9;cx.beginPath();cx.moveTo(v,M);cx.lineTo(v,M+W);cx.moveTo(M,v);cx.lineTo(M+W,v);cx.stroke()}
 cx.lineWidth=3;cx.strokeRect(M,M,W,W);
 for(const s of stones)if(!s.alive)drawStone(s);
 for(const s of stones)if(s.alive)drawStone(s);
 if(drag){
  const s=drag.s,dx=s.x-drag.x,dy=s.y-drag.y,l=Math.hypot(dx,dy);
  if(l>14){const pw=drag.edge?1:Math.min(l,MAXD)/MAXD,ux=dx/l,uy=dy/l,len=40+pw*150,x=s.x+M,y=s.y+M;
   cx.strokeStyle="rgba(255,255,255,.6)";cx.lineWidth=2;cx.setLineDash([]);
   cx.beginPath();cx.moveTo(x,y);cx.lineTo(drag.x+M,drag.y+M);cx.stroke();
   cx.strokeStyle="hsl("+(120-pw*120)+",85%,45%)";cx.lineWidth=5;cx.lineCap="round";cx.setLineDash([2,11]);
   cx.beginPath();cx.moveTo(x+ux*R,y+uy*R);cx.lineTo(x+ux*len,y+uy*len);cx.stroke();cx.setLineDash([]);
   cx.fillStyle=cx.strokeStyle;cx.beginPath();const ex=x+ux*(len+8),ey=y+uy*(len+8);
   cx.moveTo(ex+ux*12,ey+uy*12);cx.lineTo(ex-uy*9,ey+ux*9);cx.lineTo(ex+uy*9,ey-ux*9);cx.fill();
   const col="hsl("+(120-pw*120)+",90%,60%)",tx=Math.max(34,Math.min(CW-34,drag.x+M)),ty=Math.max(24,drag.y+M-40);
   cx.fillStyle="rgba(20,12,4,.9)";cx.beginPath();cx.rect(tx-31,ty-15,62,30);cx.fill();
   cx.lineWidth=2;cx.strokeStyle=col;cx.setLineDash([]);cx.strokeRect(tx-31,ty-15,62,30);
   cx.font="900 18px sans-serif";cx.textAlign="center";cx.textBaseline="middle";cx.fillStyle=col;cx.fillText(Math.round(pw*100)+"%",tx,ty+1);cx.textBaseline="alphabetic"}
 }
 drawFx();
}
/* 소리 */
let AC=null,muted=false;
function initAudio(){try{if(!AC)AC=new(window.AudioContext||window.webkitAudioContext)();if(AC.state==="suspended")AC.resume()}catch(e){}}
function tone(f1,f2,dur,type,vol,delay){if(!AC||muted)return;const t=AC.currentTime+(delay||0),o=AC.createOscillator(),g=AC.createGain();
 o.type=type;o.frequency.setValueAtTime(f1,t);o.frequency.exponentialRampToValueAtTime(Math.max(f2,20),t+dur);
 g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+dur+.02)}
function noise(dur,vol,freq){if(!AC||muted)return;const n=Math.floor(AC.sampleRate*dur),b=AC.createBuffer(1,n,AC.sampleRate),d=b.getChannelData(0);
 for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*(1-i/n);
 const s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();s.buffer=b;f.type="bandpass";f.frequency.value=freq;g.gain.value=vol;
 s.connect(f);f.connect(g);g.connect(AC.destination);s.start()}
const sfx={
 shoot(p){noise(.14,.2+p*.25,900+p*2200);tone(220+p*200,70,.14,"sine",.25)},
 hit(f){tone(1100-f*500,160,.07+f*.07,"triangle",.25+f*.4);tone(170,55,.14,"sine",.15+f*.35);noise(.05,.15+f*.35,3200)},
 out(){tone(520,60,.5,"sawtooth",.14);tone(300,45,.55,"sine",.3);noise(.25,.2,500)},
 end(w){(w?[523,659,784,1047]:[392,330,262,196]).forEach((f,i)=>tone(f,f,.28,w?"triangle":"sawtooth",w?.3:.15,i*.13))}
};
$("mute").onclick=()=>{muted=!muted;$("mute").textContent=muted?"🔇":"🔊";initAudio()};
const vib=n=>{try{navigator.vibrate&&navigator.vibrate(n)}catch(e){}};
/* 타격감 */
function burst(x,y,n,c,sp){for(let i=0;i<n;i++){const a=Math.random()*6.283,v=Math.random()*sp+1;fx.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:1,s:2+Math.random()*3,c})}}
function onHit(p,q,rv){
 if(rv<1.2)return;
 const x=(p.x+q.x)/2,y=(p.y+q.y)/2,f=Math.min(rv/14,1);
 sfx.hit(f);burst(x,y,6+Math.round(f*14),"#fff4c8",2+f*6);rings.push({x,y,r:R*.6,life:1,f});
 shake=Math.max(shake,f*5);
 if(f>.35){hitstop=Math.max(hitstop,f>.7?5:3);vib(f>.7?25:12)}
}
function onOut(s){
 const x=Math.max(40,Math.min(W-40,s.x)),y=Math.max(40,Math.min(W-40,s.y));
 sfx.out();burst(x,y,22,s.team?"#e5484d":"#2f6fed",8);texts.push({x,y,t:"아웃!",life:1});
 shake=Math.max(shake,7);hitstop=Math.max(hitstop,6);vib(45);
}
function drawFx(){
 for(let i=fx.length-1;i>=0;i--){const p=fx[i];p.x+=p.vx;p.y+=p.vy;p.vx*=.92;p.vy*=.92;p.life-=.04;
  if(p.life<=0){fx.splice(i,1);continue}
  cx.globalAlpha=p.life;cx.fillStyle=p.c;cx.beginPath();cx.arc(p.x+M,p.y+M,p.s*p.life,0,7);cx.fill()}
 for(let i=rings.length-1;i>=0;i--){const g=rings[i];g.r+=3+g.f*4;g.life-=.06;
  if(g.life<=0){rings.splice(i,1);continue}
  cx.globalAlpha=g.life;cx.strokeStyle="#fff";cx.lineWidth=3*g.life+1;cx.beginPath();cx.arc(g.x+M,g.y+M,g.r,0,7);cx.stroke()}
 for(let i=texts.length-1;i>=0;i--){const t=texts[i];t.y-=1;t.life-=.02;
  if(t.life<=0){texts.splice(i,1);continue}
  cx.globalAlpha=Math.min(1,t.life*2);cx.font="900 28px sans-serif";cx.textAlign="center";cx.lineWidth=5;cx.strokeStyle="#2b1600";cx.strokeText(t.t,t.x+M,t.y+M);cx.fillStyle="#ffd84a";cx.fillText(t.t,t.x+M,t.y+M)}
 cx.globalAlpha=1;
}
function loop(){requestAnimationFrame(loop);try{tick()}catch(e){console.error(e)}}
function tick(){
 if(hitstop>0&&phase==="move"){hitstop--}
 else if(phase==="move"){frames++;const was=stones.map(s=>s.alive);step(stones,onHit);
  stones.forEach((s,i)=>{if(was[i]&&!s.alive)onOut(s)});
  if(frames>2&&(still(stones)||frames>1200))afterShot()}
 else if(phase!=="menu")for(const s of stones)if(!s.alive&&s.k>.01){s.x+=s.vx;s.y+=s.vy;s.vx*=.96;s.vy*=.96;s.k*=.93}
 if(phase!=="menu")draw();
}
$("start").onclick=startGame;$("again").onclick=startGame;
const toMenu=()=>{gid++;phase="menu";$("game").style.display="none";$("menu").style.display="block"};
$("back").onclick=toMenu;$("tomenu").onclick=toMenu;
loop();
</script></body></html>
