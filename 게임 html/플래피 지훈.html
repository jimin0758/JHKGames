let AC=null;
function snd(type){
  try{
    if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();
    if(AC.state==='suspended')AC.resume();
    const t=AC.currentTime;
    const tone=(f1,f2,dur,wave,vol,st=0)=>{
      const o=AC.createOscillator(),g=AC.createGain();
      o.type=wave;o.frequency.setValueAtTime(f1,t+st);o.frequency.exponentialRampToValueAtTime(f2,t+st+dur);
      g.gain.setValueAtTime(vol,t+st);g.gain.exponentialRampToValueAtTime(0.001,t+st+dur);
      o.connect(g);g.connect(AC.destination);o.start(t+st);o.stop(t+st+dur+0.02);
    };
    if(type==='flap')tone(380,720,0.12,'sine',0.18);
    else if(type==='score'){tone(880,880,0.09,'square',0.08);tone(1320,1320,0.14,'square',0.08,0.08)}
    else if(type==='die'){tone(300,60,0.4,'sawtooth',0.16);tone(160,40,0.3,'square',0.1,0.05)}
  }catch(e){}
}
let state='ready',bird,pipes,score,best=0,speed,lastT=0,bgX=0;
try{best=+localStorage.getItem('flappyBest')||0}catch(e){}

function reset(){
  bird={x:100,y:H/2-40,vy:0,rot:0,sq:0};
  pipes=[];score=0;speed=150;bgX=0;
}
reset();

// 겹치지 않고 반드시 통과 가능하도록 간격/높이차를 제한
function spawnPipe(){
  const minC=GAP/2+70,maxC=H-GROUND-GAP/2-70;
  const prev=pipes.length?pipes[pipes.length-1].c:(H-GROUND)/2;
  const maxDelta=150;
  let c=prev+(Math.random()*2-1)*maxDelta;
  c=Math.max(minC,Math.min(maxC,c));
  pipes.push({x:W+20,c,passed:false});
}

function flap(){
  if(state==='ready'){state='play'}
  if(state==='play'){bird.vy=FLAP;bird.sq=1;snd('flap')}
  else if(state==='over'&&performance.now()-overAt>500){reset();state='ready'}
}
let overAt=0;
function die(){
  state='over';overAt=performance.now();snd('die');
  if(score>best){best=score;try{localStorage.setItem('flappyBest',best)}catch(e){}}
}
addEventListener('keydown',e=>{if(e.code==='Space'||e.code==='ArrowUp'){e.preventDefault();flap()}});
cv.addEventListener('pointerdown',e=>{e.preventDefault();flap()});

function update(dt){
  bird.sq=Math.max(0,bird.sq-dt*4);
  bgX=(bgX+speed*dt)%40;
  if(state==='ready'){bird.y=H/2-40+Math.sin(performance.now()/250)*8;return}
  if(state!=='play')return;
  bird.y+=bird.vy*dt+0.5*GRAV*dt*dt;bird.vy=Math.min(bird.vy+GRAV*dt,620);
  const tr=Math.max(-0.45,Math.min(1.0,bird.vy/600));bird.rot+=(tr-bird.rot)*Math.min(1,dt*10);
  speed=Math.min(380,150+score*8);
  // 속도에 비례해 간격을 넓혀 항상 일정한 반응 시간 확보
  const spacing=speed*1.55+PW;
  if(!pipes.length||pipes[pipes.length-1].x<=W-spacing)spawnPipe();
  for(const p of pipes){
    p.x-=speed*dt;
    if(!p.passed&&p.x+PW<bird.x-R){p.passed=true;score++;snd('score')}
    const top=p.c-GAP/2,bot=p.c+GAP/2;
    const hr=R-3;
    if(bird.x+hr>p.x&&bird.x-hr<p.x+PW&&(bird.y-hr<top||bird.y+hr>bot))die();
  }
  pipes=pipes.filter(p=>p.x>-PW-10);
  if(bird.y+R>H-GROUND){bird.y=H-GROUND-R;die()}
  if(bird.y-R<0){bird.y=R;bird.vy=0}
}

function drawPipe(x,y,h,cap){
  ctx.fillStyle='#4cc04c';ctx.fillRect(x,y,PW,h);
  ctx.fillStyle='#2f9a2f';ctx.fillRect(x+PW-10,y,10,h);
  ctx.fillStyle='#5fd65f';ctx.fillRect(x-4,cap,PW+8,24);
  ctx.strokeStyle='#1f6e1f';ctx.lineWidth=2;ctx.strokeRect(x,y,PW,h);ctx.strokeRect(x-4,cap,PW+8,24);
}

function drawBird(){
  ctx.save();ctx.translate(bird.x,bird.y);ctx.rotate(bird.rot);ctx.scale(1-0.08*bird.sq,1+0.12*bird.sq);
  const im=(state==='over'&&imgOver)?imgOver:img;
  if(im&&im.complete&&im.width){
    ctx.save();ctx.beginPath();ctx.arc(0,0,R+4,0,7);ctx.clip();
    const s=Math.min(im.width,im.height),sx=(im.width-s)/2,sy=(im.height-s)/2;
    ctx.drawImage(im,sx,sy,s,s,-R-4,-R-4,(R+4)*2,(R+4)*2);ctx.restore();
    ctx.strokeStyle='#fff';ctx.lineWidth=2.5;ctx.beginPath();ctx.arc(0,0,R+4,0,7);ctx.stroke();
  }else{
    ctx.fillStyle='#ffd23f';ctx.beginPath();ctx.arc(0,0,R,0,7);ctx.fill();
    ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(7,-5,6,0,7);ctx.fill();
    ctx.fillStyle='#000';ctx.beginPath();ctx.arc(9,-5,2.5,0,7);ctx.fill();
    ctx.fillStyle='#ff7a2f';ctx.beginPath();ctx.moveTo(14,2);ctx.lineTo(26,6);ctx.lineTo(14,10);ctx.fill();
  }
  ctx.restore();
}

function text(t,x,y,size,color='#fff'){
  ctx.font='800 '+size+'px sans-serif';ctx.textAlign='center';
  ctx.lineWidth=5;ctx.strokeStyle='rgba(0,0,0,.55)';ctx.strokeText(t,x,y);
  ctx.fillStyle=color;ctx.fillText(t,x,y);
}

function draw(){
  const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#6cc8f0');g.addColorStop(1,'#d6f1ff');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  for(const p of pipes){
    const top=p.c-GAP/2,bot=p.c+GAP/2;
    drawPipe(p.x,0,top,top-24);
    drawPipe(p.x,bot,H-GROUND-bot,bot);
  }
  ctx.fillStyle='#ded895';ctx.fillRect(0,H-GROUND,W,GROUND);
  ctx.fillStyle='#8fcf4a';ctx.fillRect(0,H-GROUND,W,14);
  ctx.fillStyle='#c9c27a';
  for(let x=-bgX;x<W;x+=40)ctx.fillRect(x,H-GROUND+14,20,6);
  drawBird();
  if(state!=='ready')text(score,W/2,80,52);
  if(state==='ready'){text('터치해서 시작!',W/2,H/2-120,30)}
  if(state==='over'){
    ctx.fillStyle='rgba(0,0,0,.45)';ctx.fillRect(0,0,W,H);
    text('게임 오버',W/2,H/2-60,44,'#ffd23f');
    text('점수 '+score,W/2,H/2,32);
    text('최고 '+best,W/2,H/2+44,26);
    text('터치해서 다시 시작',W/2,H/2+100,20);
  }
}

function loop(t){
  const dt=Math.min(0.033,(t-lastT)/1000||0);lastT=t;
  update(dt);draw();requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
