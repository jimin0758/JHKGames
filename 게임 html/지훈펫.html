<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>키우기 게임</title>
<style>
:root{--bg:#eef6ff;--card:#fff;--tx:#1d2733;--sub:#6b7a8c;--bd:#d5e2f0;--ac:#3b82f6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121821;--card:#1c2530;--tx:#e8eef5;--sub:#93a3b5;--bd:#2c3a4a}}
*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;min-height:100vh}
#app{max-width:460px;margin:0 auto;padding:14px}
h1{font-size:18px;margin:4px 0 10px;text-align:center}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:12px;margin-bottom:10px}
.bars{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px;font-size:13px}
.bar{height:8px;background:var(--bd);border-radius:6px;overflow:hidden;margin-top:3px}.bar i{display:block;height:100%;background:var(--ac);transition:width .3s}
.bar.low i{background:#ef4444}
#stage{position:relative;height:340px;display:flex;align-items:flex-end;justify-content:center;overflow:hidden;background:linear-gradient(var(--card),var(--bg));border-radius:12px}
#pet{object-fit:contain;transition:height .6s;animation:bob 2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px)}}
#pet.dead{filter:grayscale(1);opacity:.55;animation:die 1.8s ease-in forwards}
@keyframes die{0%{transform:rotate(0)}15%{transform:rotate(-12deg)}30%{transform:rotate(12deg)}45%{transform:rotate(-8deg) translateY(-14px)}100%{transform:rotate(90deg) translateY(8px)}}
#pet.old{filter:sepia(.45) contrast(.95)}
#stage.dead::after{content:"👻";position:absolute;left:50%;bottom:30%;font-size:44px;opacity:0;animation:ghost 3s ease-out 1s forwards}
@keyframes ghost{0%{opacity:0;transform:translate(-50%,0)}20%{opacity:1}100%{opacity:0;transform:translate(-50%,-180px)}}
#pet.sick{filter:hue-rotate(80deg) saturate(.6)}
.poop{position:absolute;font-size:30px;cursor:pointer;bottom:4px;background:none;border:0;padding:4px}
#msg{text-align:center;font-size:14px;min-height:20px;margin:8px 0 0;color:var(--sub)}
.btns{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
button.a{border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:12px;padding:10px 0;font-size:13px;cursor:pointer}
button.a b{display:block;font-size:22px}button.a:disabled{opacity:.35}button.a:active{transform:scale(.96)}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:20px;z-index:5}
.ov .card{width:100%;max-width:340px;text-align:center}
input{width:100%;padding:10px;font-size:16px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);margin:10px 0}
.go{background:var(--ac);color:#fff;border:0;border-radius:10px;padding:10px 20px;font-size:15px;cursor:pointer}
html,body{height:100%}body{min-height:0;overflow:hidden}
#app{height:100%;display:flex;flex-direction:column;gap:6px;padding:8px 12px}
#app .card{margin:0;padding:8px}
.card.sc{flex:1;min-height:0;display:flex;flex-direction:column}
#stage{flex:1;height:auto!important;min-height:0}
#pet{max-height:96%;max-width:100%}
#app h1{margin:0;font-size:16px;text-align:left}
.bars{font-size:12px;gap:4px 10px}
#msg{margin:4px 0 0;font-size:13px;min-height:18px}
button.a{padding:6px 0}button.a b{font-size:20px}
#rs{z-index:6}#bFill{touch-action:none;user-select:none;-webkit-user-select:none}
#mid{flex:1;min-height:0;display:flex;gap:6px}
.side{display:flex;flex-direction:column;justify-content:center;gap:8px;flex:none}#sl{width:78px}#sr{width:96px}
.side button.a{font-size:11px;padding:10px 2px;width:100%}
.row{display:flex;gap:4px;align-items:stretch}.row button.a{flex:1;min-width:0;width:auto;padding:10px 2px}
.gauge{width:8px;flex:none;background:var(--bd);border-radius:6px;position:relative;overflow:hidden}.gauge i{position:absolute;left:0;right:0;bottom:0;height:0;background:var(--ac)}
.hint{font-size:10px;color:var(--sub);line-height:1.35;text-align:center}
.side #bCure{padding:18px 2px;font-size:14px;font-weight:700;border:2px solid var(--ac)}.side #bCure b{font-size:34px}
</style></head><body><div id="app">
<div style="display:flex;align-items:center;gap:8px"><h1 id="title" style="flex:1">🐣 키우기 게임</h1><button class="a" id="reset" style="padding:6px 10px">🔄 초기화</button></div>
<div class="card"><div class="bars" id="bars"></div></div>
<div id="mid"><div class="side" id="sl"><button class="a" id="bCook"><b>🍳</b>조리 0/10</button><div class="row"><button class="a" id="bFill"><b>🪣</b><span>물통 물받기</span></button><div class="gauge"><i id="gFill"></i></div></div><div class="hint">물통 물받기는<br>3초 꾹 누르기</div></div><div class="card sc"><div id="stage"><img id="pet" alt="캐릭터"></div><p id="msg"></p></div><div class="side" id="sr"><button class="a" id="bCure"><b>💊</b>만능약</button><div class="hint">게임당 딱 1번!<br>게이지 전부 100, 💩 전부 치우고 건강 +50</div><button class="a" id="bTub"><b>🚿</b>욕조 물받기</button><div class="hint">누르면 물받기 시작!<br>시간이 9~11초일 때 다시 눌러 멈추면 성공, 다른 타이밍이면 처음부터</div></div></div>
<div class="btns">
<button class="a" id="bFood"><b>🍚</b>밥 0</button><button class="a" id="bWater"><b>💧</b>물 0</button>
<button class="a" id="bBath"><b>🛁</b>목욕</button><button class="a" id="bPlay"><b>🎮</b>놀기</button></div>
<p style="margin:0;text-align:center;font-size:11px;color:var(--sub)">💩를 눌러 치워주세요 (장난감 5개도 하나씩 눌러요). 목욕은 2단계, 놀기는 3단계부터 필요해요. 노년기엔 점점 빠르게!</p>
</div>
<div class="ov" id="ov"><div class="card"><h2 id="ovT">이름을 지어주세요</h2><p id="ovP" style="color:var(--sub);font-size:14px">새 친구를 키워볼까요?</p>
<input id="nm" maxlength="10" placeholder="이름 입력"><button class="go" id="start">시작하기</button></div></div>
<div class="ov" id="rs" style="display:none"><div class="card"><h2>초기화할까요?</h2><p style="color:var(--sub);font-size:14px">지금까지 키운 기록이 모두 사라져요.</p><button class="go" id="rsYes" style="background:#ef4444">초기화</button> <button class="go" id="rsNo" style="background:var(--sub)">취소</button></div></div>

const $=id=>document.getElementById(id);
let S=null,alt=0;
const fresh=n=>({cook:0,meals:0,water:0,bathReady:false,bathing:0,toys:[],real:0,cureUsed:false,name:n,age:0,hunger:100,thirst:100,clean:100,fun:100,health:100,poops:[],dead:false,cause:""});
function load(){try{const v=localStorage.getItem(KEY);return v?Object.assign(fresh(""),JSON.parse(v)):null}catch(e){return null}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const stage=()=>S.age<35?1:S.age<87?2:S.age<155?3:4;
const stageName=()=>["","아기","어린이","어른","노년"][stage()];
function say(t){$("msg").textContent=t}
function flash(){$("pet").src=IMG2;clearTimeout(flash.t);flash.t=setTimeout(()=>{$("pet").src=IMG1},1200)}
function act(k){
 if(!S||S.dead)return;
 if(k=="food"){if(S.meals<=0)return;S.meals--;S.hunger=Math.min(100,S.hunger+5);say(S.name+"가 밥을 먹었어요 🍚")}
 if(k=="water"){if(S.water<=0)return;S.water--;S.thirst=Math.min(100,S.thirst+5);say(S.name+"가 물을 마셨어요 💧")}
 if(k=="bath"){if(!S.bathReady)return;S.bathReady=false;S.clean=Math.min(100,S.clean+30);say("뽀득뽀득 깨끗해졌어요 🛁")}
 if(k=="play"){if(S.toys.length)return;S.toys=Array.from({length:5},(_,i)=>({e:["🧸","🧩","🚗","⚽","🪀"][i],x:6+i*15.5+Math.random()*4,y:Math.random()*60}));S.fun=Math.min(100,S.fun+10);say("신나게 놀았어요 🎮")}
 flash();render();save();
}
function cook(){if(!S||S.dead)return;if(S.meals>=10){say("밥이 가득 찼어요 (최대 10인분)");return}S.cook++;if(S.cook>=10){S.cook=0;S.meals=Math.min(10,S.meals+5);say("밥이 5인분 완성! 🍳")}else say(`조리 중... ${S.cook}/10`);render();save()}
let hold=null,holdT=0;
function holdStart(e){e.preventDefault();if(!S||S.dead||hold)return;holdT=Date.now();hold=setInterval(()=>{const p=Math.min(1,(Date.now()-holdT)/(3000/speed()));$("gFill").style.height=Math.round(p*100)+"%";if(p>=1)holdEnd(true)},50)}
function holdEnd(done){if(!hold)return;clearInterval(hold);hold=null;$("gFill").style.height="0%";if(done===true){S.water=10;say("물통이 가득 찼어요 🪣 (10회분)");render();save()}else say("3초 동안 계속 눌러야 해요")}
function bathToggle(){if(!S||S.dead)return;if(!S.bathing){S.bathing=Date.now();S.bathReady=false;say("욕조에 물 받는 중... 🚿")}else{const t=(Date.now()-S.bathing)/1000;S.bathing=0;if(t>=9&&t<=11){S.bathReady=true;say("물이 딱 맞아요! 목욕하세요 🛁")}else{S.bathReady=false;say(t<9?"물이 모자라요! 다시 받아야 해요":"물이 넘쳤어요! 다시 받아야 해요")}}render();save()}
function cure(){if(!S||S.dead||S.cureUsed)return;S.cureUsed=true;S.hunger=S.thirst=S.clean=S.fun=100;S.poops=[];S.health=Math.min(100,S.health+50);say("💊 만능 치료제 사용! 게이지 가득, 💩 정리, 건강 +50");flash();render();save()}
function toy(i){if(!S||S.dead)return;S.toys.splice(i,1);say(S.toys.length?`장난감 ${S.toys.length}개 남았어요`:"장난감 정리 완료 🧸");render();save()}
function clean(i){S.poops.splice(i,1);say("💩 치웠어요!");render();save()}
function tick(){
 if(!S||S.dead)return;
 if(getComputedStyle($("ov")).display!="none")return;S.age++;S.real+=dt;const st=stage(),r=.6+.25*st;
 S.hunger=Math.max(0,S.hunger-r);S.thirst=Math.max(0,S.thirst-r*1.2);
 if(st>=2)S.clean=Math.max(0,S.clean-.55*(st>3?1.5:1));else S.clean=100;
 if(st>=3)S.fun=Math.max(0,S.fun-.7*(st>3?1.5:1));else S.fun=100;
 if(Math.random()<1/Math.max(4,16-3*st)&&S.poops.length<8)S.poops.push({x:Math.random()*80+5});
 let bad=[];
 if(S.hunger<=0)bad.push("배고픔");if(S.thirst<=0)bad.push("목마름");
 if(st>=2&&S.clean<=0)bad.push("더러움");if(st>=3&&S.fun<=0)bad.push("지루함");
 
 if(S.poops.length>=3)bad.push("방치된 배설물");
 if(bad.length){S.health-=2.6*bad.length;S.cause=bad[0]}else S.health=Math.min(100,S.health+(st>3?.1:.25));
 if(S.health<=0){S.dead=true;S.health=0}
 render();if(S.age%5==0)save();
}
function bar(l,v,show=true){return show?`<div>${l} ${Math.round(v)}<div class="bar ${v<25?"low":""}"><i style="width:${v}%"></i></div></div>`:""}
function render(){
 const st=stage();
 $("title").textContent=`🐣 ${S.name} · ${stageName()} (${Math.floor(S.real/60)}분 ${Math.floor(S.real%60)}초)${st>3?" ⚡x"+speed().toFixed(1):""}`;
 $("bars").innerHTML='<div style="grid-column:1/-1">'+bar("❤️ 건강",S.health)+'</div>'+bar("🍚 배고픔",S.hunger)+bar("💧 목마름",S.thirst)+bar("🛁 청결",S.clean,st>=2)+bar("🎮 즐거움",S.fun,st>=3);
 const D=S.dead;
 $("bCook").innerHTML=`<b>🍳</b>조리 ${S.cook}/10`;$("bCook").disabled=D;$("bFill").disabled=D;
 $("bFood").innerHTML=`<b>🍚</b>밥 ${S.meals}`;$("bFood").disabled=D||S.meals<=0;
 $("bWater").innerHTML=`<b>💧</b>물 ${S.water}`;$("bWater").disabled=D||S.water<=0;
 $("bTub").innerHTML=tubLabel();$("bTub").disabled=D||st<2;
 $("bBath").innerHTML=`<b>🛁</b>목욕${S.bathReady?" ✔":""}`;$("bBath").disabled=D||st<2||!S.bathReady;
 $("bPlay").disabled=D||st<3||S.toys.length>0;$("bCure").disabled=D||S.cureUsed;$("bCure").innerHTML=`<b>💊</b>${S.cureUsed?"사용함":"만능약"}`;
 const p=$("pet");p.style.height=Math.min(120+S.age*1.5,270)+"px";
 p.className=S.dead?"dead":S.health<50?"sick":st>3?"old":"";$("stage").classList.toggle("dead",!!S.dead);
 const sig=JSON.stringify([S.poops,S.toys]);const rebuild=sig!==render.sig;render.sig=sig;if(rebuild)document.querySelectorAll(".poop").forEach(e=>e.remove());
 (rebuild?S.toys:[]).forEach((o,i)=>{const t=document.createElement("button");t.className="poop";t.textContent=o.e;t.style.left=o.x+"%";t.style.bottom=(4+o.y)+"px";t.onclick=()=>toy(i);$("stage").appendChild(t)});
 (rebuild?S.poops:[]).forEach((o,i)=>{const b=document.createElement("button");b.className="poop";b.textContent="💩";b.style.left=o.x+"%";b.onclick=()=>clean(i);$("stage").appendChild(b)});
 if(S.dead){say(`${S.name}가 ${S.cause}(으)로 병에 걸려 죽었어요 😢`);showOver()}
 else if(S.health<50)say(`${S.name}가 아파해요! 빨리 돌봐주세요 🤒`);
 else if(S.poops.length>=1)say("배설물이 쌓이고 있어요!");
}
function showOver(){if($("ov").style.display=="flex"||showOver.p)return;showOver.p=1;setTimeout(()=>{showOver.p=0;showOver2()},2800)}
function showOver2(){if(!S.dead)return;$("ovT").textContent="💀 게임 오버";$("ovP").textContent=`${S.name}는 ${Math.floor(S.real/60)}분 ${Math.floor(S.real%60)}초 동안 살았어요.`;$("nm").value=S.name;$("start").textContent="다시 키우기";$("ov").style.display="flex"}
$("start").onclick=()=>{const n=$("nm").value.trim();if(!n){$("nm").focus();return}S=fresh(n);$("ov").style.display="none";$("pet").src=IMG1;say(n+"가 태어났어요!");render();save()};
$("bFood").onclick=()=>act("food");$("bWater").onclick=()=>act("water");$("bBath").onclick=()=>act("bath");$("bPlay").onclick=()=>act("play");$("bCook").onclick=cook;$("bCure").onclick=cure;$("bTub").onclick=bathToggle;
const fb=$("bFill");fb.addEventListener("pointerdown",holdStart);["pointerup","pointerleave","pointercancel"].forEach(ev=>fb.addEventListener(ev,()=>holdEnd()));fb.oncontextmenu=e=>e.preventDefault();
const sv=load();$("pet").src=IMG1;
if(sv&&!sv.dead){S=sv;$("ov").style.display="none";render()}else{S=fresh("");S.dead=false;$("ov").style.display="flex";S=fresh("친구");}
$("reset").onclick=()=>{$("rs").style.display="flex"};
$("rsNo").onclick=()=>{$("rs").style.display="none"};
$("rsYes").onclick=()=>{try{localStorage.removeItem(KEY)}catch(e){}S=fresh("친구");$("rs").style.display="none";$("ovT").textContent="이름을 지어주세요";$("ovP").textContent="새 친구를 키워볼까요?";$("nm").value="";$("start").textContent="시작하기";$("ov").style.display="flex";$("pet").src=IMG1;say("");render()};
function tubLabel(){return S.bathing?`<b>${((Date.now()-S.bathing)/1000).toFixed(1)}</b>그만`:"<b>🚿</b>욕조 물받기"}
setInterval(()=>{if(S&&S.bathing)$("bTub").innerHTML=tubLabel()},100);
let dt=.6;
function speed(){return S&&stage()>=4?1+Math.min(3,(S.age-155)*.01):1}
function loop(){const iv=600/speed();dt=iv/1000;tick();setTimeout(loop,iv)}
loop();
</script></body></html>
